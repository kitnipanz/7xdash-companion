<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Every 7xDash feature for the Zeekr 7X head unit, with real screenshots and how to use it. Thai and English.">
<title>7xDash Features</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Anuphan:wght@400;500;600&display=swap">
<style>
/* Layout: the real Home screen is the map; each feature opens its own page with the real screen it lives on. */
:root {
  --bg: #0d0e10; --surface: #17181b; --line: #2a2c31; --fg: #ececee; --dim: #9fa1a8; --mark: #ff7a1a; --beta: #9db8ea;
  --head: "Bai Jamjuree", "Anuphan", system-ui, sans-serif;
  --text: "Anuphan", system-ui, -apple-system, "Thonburi", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f2f1ee; --surface: #ffffff; --line: #dedcd6; --fg: #18191c; --dim: #5f6168; --mark: #d9580a; --beta: #3a5fa8; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f2f1ee; --surface: #ffffff; --line: #dedcd6; --fg: #18191c; --dim: #5f6168; --mark: #d9580a; --beta: #3a5fa8; color-scheme: light; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 var(--text); }
.page { max-width: 1320px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.word { font: 700 20px var(--head); letter-spacing: .02em; text-decoration: none; }
.word small { font: 500 13px var(--text); color: var(--dim); margin-left: 10px; letter-spacing: 0; }
.lang { display: flex; gap: 2px; font: 500 14px var(--text); }
.lang button { background: none; border: 0; color: var(--dim); padding: 6px 10px; cursor: pointer; border-bottom: 2px solid transparent; font: inherit; }
.lang button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--mark); }

/* overview */
.intro { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; padding-block: 28px; align-items: end; }
.intro h1 { font: 600 clamp(30px, 4.4vw, 46px)/1.15 var(--head); margin: 0; text-wrap: balance; }
.intro p { margin: 0; color: var(--dim); max-width: 60ch; }
.intro .note { font-size: 14px; margin-top: 10px; }
.split { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.screen { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.shot { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #111; }
.shot img { display: block; width: 100%; height: auto; }
.spot { position: absolute; border: 3px solid var(--mark); border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); pointer-events: none; transition: all .25s ease; }
.hit { position: absolute; background: transparent; border: 0; cursor: pointer; padding: 0; }
.caption { margin-top: 12px; color: var(--dim); font-size: 14px; }
.index { display: grid; gap: 28px; min-width: 0; }
.group h2 { font: 600 14px var(--text); color: var(--dim); margin: 0 0 4px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; text-decoration: none; border-top: 1px solid var(--line); padding: 12px 0; }
.item .name { font: 600 18px/1.3 var(--head); display: flex; gap: 8px; align-items: baseline; }
.item .what { color: var(--dim); margin-top: 2px; }
.item .go { color: var(--dim); font-size: 20px; transition: transform .15s; }
.item:hover .name, .item:focus-visible .name { color: var(--mark); }
.item:hover .go { transform: translateX(3px); color: var(--mark); }
.beta { font: 500 12px var(--text); color: var(--beta); }
.start { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.start h3 { font: 600 17px var(--head); margin: 0 0 4px; }
.start p { margin: 0; color: var(--dim); font-size: 15px; }

/* detail */
.crumb { display: inline-flex; gap: 8px; align-items: center; margin-top: 22px; color: var(--dim); text-decoration: none; font-size: 15px; }
.crumb:hover { color: var(--fg); }
.dhead { padding-block: 12px 24px; display: grid; gap: 8px; max-width: 70ch; }
.dhead .where { font-size: 14px; color: var(--dim); }
.dhead h1 { font: 600 clamp(30px, 4.6vw, 48px)/1.12 var(--head); margin: 0; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.dhead h1 .beta { font-size: 15px; }
.dhead p { margin: 0; font-size: 18px; color: var(--fg); }
.dshot { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #111; position: relative; margin: 0; }
.dshot img { display: block; width: 100%; height: auto; }
.dshot figcaption { position: absolute; left: 12px; bottom: 12px; background: rgba(13,14,16,.82); color: #ececee; font-size: 13px; padding: 4px 10px; border-radius: 6px; }
.dbody { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; padding-top: 28px; }
.dbody h2 { font: 600 20px var(--head); margin: 0 0 8px; }
.dbody section + section { margin-top: 26px; }
.dbody p { margin: 0; }
.dbody ol, .dbody ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.dbody ol li::marker { color: var(--mark); font-weight: 600; font-family: var(--head); }
.dbody ul li::marker { color: var(--dim); }
.open { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.notes li { color: var(--dim); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 40px; border-top: 1px solid var(--line); padding-top: 16px; }
.pager a { text-decoration: none; display: grid; gap: 2px; padding: 8px 0; }
.pager a:last-child { text-align: right; }
.pager small { color: var(--dim); font-size: 13px; }
.pager b { font: 600 18px var(--head); }
.pager a:hover b { color: var(--mark); }
footer { margin-top: 32px; color: var(--dim); font-size: 13px; }

@media (max-width: 920px) {
  .intro, .split, .dbody { grid-template-columns: minmax(0, 1fr); }
  .screen { top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 8px; z-index: 2; }
  .caption { display: none; }
  .start { grid-template-columns: minmax(0, 1fr); }
  .dbody { gap: 0; }
  .dbody > div + div { margin-top: 26px; }
}
@media (prefers-reduced-motion: reduce) { .spot, .item .go { transition: none; } }
</style>
</head>

    steps: ["Open Settings → Check for updates.", "If there is a newer version, tap to download and install.", "After the update, read What's new. It shows once."],
    options: ["Include beta releases.", "What's new shows the last three versions any time."],
    notes: ["Works without internet only for What's new; checking needs a connection."] },
  th: { name: "อัปเดตและมีอะไรใหม่", what: "แอปเช็กเวอร์ชันใหม่ให้ และอัปเดตเสร็จจะบอกว่ามีอะไรเปลี่ยนบ้าง",
    intro: "เช็กเวอร์ชันใหม่จาก GitHub โหลดและติดตั้งให้ เปิดแอปครั้งแรกหลังอัปเดตจะโชว์ว่ามีอะไรใหม่บ้างตั้งแต่เวอร์ชันที่ใช้ล่าสุด",
    open: "ตั้งค่า → ตรวจสอบอัปเดต",
    steps: ["เปิด ตั้งค่า → ตรวจสอบอัปเดต", "ถ้ามีเวอร์ชันใหม่ กดเพื่อโหลดและติดตั้ง", "อัปเดตเสร็จ อ่าน มีอะไรใหม่ ได้เลย ขึ้นแค่ครั้งเดียว"],
    options: ["รวมรุ่นเบต้า", "มีอะไรใหม่ เปิดดูสามเวอร์ชันล่าสุดได้ตลอด"],
    notes: ["ต้องมีเน็ตถึงจะเช็กอัปเดตได้ แต่หน้า มีอะไรใหม่ เปิดได้แม้ไม่มีเน็ต"] } },

{ id: "diagnostics", spot: "settings", group: "more", img: "home",
  en: { name: "Diagnostics", what: "Makes a report to send when something isn't working.",
    intro: "Collects what the developer needs to fix a problem: the head unit, cameras, network, split-screen support and recent logs, in one file.",
    open: "Settings → System → Diagnostics.",
    steps: ["Open Settings → System → Diagnostics.", "Wait a few seconds while it collects.", "Scan the QR code to send the report to your phone, then pass it on."],
    options: ["Crash reports and usage stats can be switched on or off in Settings."],
    notes: ["No photos or videos are in the report."] },
  th: { name: "การวินิจฉัย", what: "สร้างรายงานไว้ส่งให้คนทำแอป เวลามีอะไรไม่ทำงาน",
    intro: "รวบรวมข้อมูลที่ผู้พัฒนาต้องใช้แก้ปัญหา เช่น ข้อมูลจอรถ กล้อง เครือข่าย การรองรับแบ่งจอ และ log ล่าสุด ไว้ในไฟล์เดียว",
    open: "ตั้งค่า → ระบบ → การวินิจฉัย",
    steps: ["เปิด ตั้งค่า → ระบบ → การวินิจฉัย", "รอสักครู่ให้แอปเก็บข้อมูล", "สแกน QR เพื่อส่งรายงานเข้ามือถือ แล้วส่งต่อให้ผู้พัฒนา"],
    options: ["รายงานแครชและสถิติการใช้งาน เปิดปิดได้ในหน้าตั้งค่า"],
    notes: ["ในรายงานไม่มีรูปหรือวิดีโอ"] } }
];
</script>
<script>
const C = [23.2, 42.25, 61.4, 80.45], R = [1.1, 20.9, 40.8, 60.6, 80.35];
const card = (r, c) => [C[c], R[r], 18.5, 18.7];
const RAIL = { dim: 22.9, eq: 67.0, airplay: 78.1, settings: 89.1 };
const rail = k => [0.7, RAIL[k], 4.95, 9.95];
const SPOT = {
  recorder: [6.3, 18.9, 15.8, 80.5], floating: [81.9, 1.2, 12.7, 6.1],
  photo: card(0,0), videos: card(0,1), rear: card(0,2), blind: card(0,3),
  capture: card(1,0), saved: card(1,1), remote: card(1,2), megaphone: card(1,3),
  drive: card(2,0), sticker: card(2,1), mood: card(2,2), shortcuts: card(2,3),
  hud: card(3,0), speaker: card(3,1), announce: card(3,2), dash: card(3,3),
  arrival: card(4,0), parked: card(4,1),
  dim: rail("dim"), eq: rail("eq"), airplay: rail("airplay"), settings: rail("settings")
};

const T = {
  en: {
    tag: "for the Zeekr 7X", h1: "What 7xDash does, and how to use it",
    lede: "Everything starts on this Home screen. Point at a feature to see where it is, then open it for the full how-to.",
    note: "7xDash is made by owners, not by Zeekr, and it is still being tested. It does not replace the car's own cameras or safety systems. Set things up while parked.",
    groups: { cards: "Home cards", rail: "Left rail", more: "Floating and in Settings" },
    beta: "beta", hint: "Tap a card on the screen, or pick a feature from the list.",
    start: [["Before you start", "Install the newest APK from GitHub Releases and plug in a USB drive. Clips, photos and your settings backup all go on it."],
            ["Tap or hold", "Tap a card to use it. Hold a card to open its settings. The rail on the left is there on every page."],
            ["Beta features", "Battery at arrival, Where I parked and Mood light only show after Settings → Interface → Beta features."]],
    all: "All features", open: "How to open it", steps: "How to use it", options: "What you can change", notes: "Good to know",
    prev: "Previous", next: "Next", homeShot: "Where it is on the Home screen", realShot: "The real screen in 7xDash",
    foot: "7xDash 1.6.12-beta · open source, GPL-3.0 · screenshots from the head unit emulator · if something does not work, Settings → System → Diagnostics makes a report to send."
  },
  th: {
    tag: "สำหรับ ZEEKR 7X", h1: "7xDash ทำอะไรได้บ้าง และใช้ยังไง",
    lede: "ทุกอย่างเริ่มจากหน้าหลักนี้ ชี้ที่ฟีเจอร์เพื่อดูว่าอยู่ตรงไหน แล้วกดเข้าไปดูวิธีใช้แบบละเอียด",
    note: "7xDash เป็นแอปที่เจ้าของรถทำกันเอง ไม่ใช่ของ ZEEKR และยังอยู่ระหว่างทดสอบ ใช้แทนกล้องหรือระบบความปลอดภัยของรถไม่ได้ ควรตั้งค่าตอนจอดรถ",
    groups: { cards: "การ์ดบนหน้าหลัก", rail: "แถบด้านซ้าย", more: "ปุ่มลอย และในหน้าตั้งค่า" },
    beta: "เบต้า", hint: "แตะการ์ดบนรูปจอ หรือเลือกฟีเจอร์จากรายการ",
    start: [["ก่อนเริ่ม", "ลง APK ตัวล่าสุดจาก GitHub แล้วเสียบแฟลชไดรฟ์ทิ้งไว้ คลิป รูป และไฟล์สำรองการตั้งค่าจะเก็บลงแฟลชไดรฟ์ทั้งหมด"],
            ["แตะ กับ กดค้าง", "แตะการ์ดเพื่อใช้งาน กดค้างเพื่อเข้าไปตั้งค่าฟีเจอร์นั้น แถบซ้ายมีให้กดได้ทุกหน้า"],
            ["ฟีเจอร์เบต้า", "แบตเมื่อถึงที่หมาย จอดรถไว้ที่ไหน และไฟบรรยากาศ จะโผล่มาหลังเปิด ตั้งค่า → อินเทอร์เฟซ → ฟีเจอร์เบต้า"]],
    all: "ฟีเจอร์ทั้งหมด", open: "เปิดยังไง", steps: "ใช้ยังไง", options: "ปรับอะไรได้บ้าง", notes: "ควรรู้",
    prev: "ก่อนหน้า", next: "ถัดไป", homeShot: "ตำแหน่งบนหน้าหลัก", realShot: "หน้าจอจริงใน 7xDash",
    foot: "7xDash 1.6.12-beta · โอเพนซอร์ส GPL-3.0 · ภาพหน้าจอจากตัวจำลองจอรถ · ถ้ามีอะไรไม่ทำงาน ไปที่ ตั้งค่า → ระบบ → การวินิจฉัย แล้วส่งรายงานมาได้เลย"
  }
};

const F = window.FEATURES;
const byId = Object.fromEntries(F.map((f, i) => [f.id, i]));
let lang = "en";
try {
  const s = localStorage.getItem("7xdash-lang");
  if (s === "en" || s === "th") lang = s; else if (/^th/i.test(navigator.language || "")) lang = "th";
} catch (e) { if (/^th/i.test(navigator.language || "")) lang = "th"; }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const img = name => `img/${lang}/${name}.jpg`;
const box = ([l, t, w, h]) => `left:${l}%;top:${t}%;width:${w}%;height:${h}%`;

function overview() {
  const t = T[lang];
  let list = "";
  for (const g of ["cards", "rail", "more"]) {
    list += `<section class="group"><h2>${t.groups[g]}</h2>`;
    for (const f of F.filter(x => x.group === g)) {
      const d = f[lang];
      list += `<a class="item" href="#${f.id}" data-id="${f.id}"><div><div class="name">${esc(d.name)}${f.beta ? `<span class="beta">${t.beta}</span>` : ""}</div>
        <div class="what">${esc(d.what)}</div></div><span class="go" aria-hidden="true">→</span></a>`;
    }
    list += `</section>`;
  }
  const seen = new Set();
  const hits = F.filter(f => !seen.has(f.spot) && seen.add(f.spot))
    .map(f => `<a class="hit" href="#${f.id}" style="${box(SPOT[f.spot])}" aria-label="${esc(f[lang].name)}" data-id="${f.id}"></a>`).join("");
  $("view").innerHTML = `
    <section class="intro"><h1>${t.h1}</h1><div><p>${t.lede}</p><p class="note">${t.note}</p></div></section>
    <div class="split">
      <div class="screen"><div class="shot" id="shot"><img src="${img("home")}" alt="" width="1600" height="925">
        <div class="spot" id="spot" style="${box(SPOT.recorder)}"></div>${hits}</div>
        <div class="caption" id="cap">${t.hint}</div></div>
      <div class="index">${list}</div>
    </div>
    <section class="start">${t.start.map(([h, p]) => `<div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("")}</section>`;
  const show = e => {
    const a = e.target.closest("[data-id]"); if (!a) return;
    const f = F[byId[a.dataset.id]];
    $("spot").setAttribute("style", box(SPOT[f.spot]));
    $("cap").textContent = f[lang].name + " · " + f[lang].what;
  };
  $("view").onmouseover = show;
  $("view").onfocusin = show;
}

function detail(i) {
  const t = T[lang], f = F[i], d = f[lang];
  const prev = F[(i - 1 + F.length) % F.length], next = F[(i + 1) % F.length];
  const pic = f.img === "home"
    ? `<figure class="dshot"><img src="${img("home")}" alt="${esc(d.name)}" width="1600" height="925"><div class="spot" style="${box(SPOT[f.spot])}"></div><figcaption>${t.homeShot}</figcaption></figure>`
    : `<figure class="dshot"><img src="${img(f.img)}" alt="${esc(d.name)}" width="1280" height="740"><figcaption>${t.realShot}</figcaption></figure>`;
  const li = a => a.map(x => `<li>${esc(x)}</li>`).join("");
  $("view").onmouseover = null;
  $("view").onfocusin = null;
  $("view").innerHTML = `
    <a class="crumb" href="#top">← ${t.all}</a>
    <header class="dhead"><div class="where">${t.groups[f.group]}</div>
      <h1>${esc(d.name)}${f.beta ? `<span class="beta">${t.beta}</span>` : ""}</h1><p>${esc(d.intro)}</p></header>
    ${pic}
    <div class="dbody">
      <div>
        <section><h2>${t.open}</h2><p class="open">${esc(d.open)}</p></section>
        <section><h2>${t.steps}</h2><ol>${li(d.steps)}</ol></section>
      </div>
      <div>
        <section><h2>${t.options}</h2><ul>${li(d.options)}</ul></section>
        <section><h2>${t.notes}</h2><ul class="notes">${li(d.notes)}</ul></section>
      </div>
    </div>
    <nav class="pager" aria-label="${t.prev} / ${t.next}">
      <a href="#${prev.id}"><small>← ${t.prev}</small><b>${esc(prev[lang].name)}</b></a>
      <a href="#${next.id}"><small>${t.next} →</small><b>${esc(next[lang].name)}</b></a>
    </nav>`;
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  $("tag").textContent = t.tag;
  $("foot").textContent = t.foot;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const id = location.hash.slice(1);
  if (id in byId) { detail(byId[id]); document.title = F[byId[id]][lang].name + " · 7xDash"; }
  else { overview(); document.title = "7xDash Features"; }
}

window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
document.querySelector(".lang").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  lang = b.dataset.lang; try { localStorage.setItem("7xdash-lang", lang); } catch (err) {}
  render();
});
render();
</script>
</body>
</html>
