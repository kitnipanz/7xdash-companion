<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Every 7xDash feature and setting for the Zeekr 7X head unit, with real screenshots and how to use them. Thai and English.">
<title>7xDash Features</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Anuphan:wght@400;500;600&display=swap">
<style>
/* Layout: the real Home screen is the map; each feature opens its own page with the real screen it lives on. */
:root {
  --bg: #0d0e10; --surface: #17181b; --line: #2a2c31; --fg: #ececee; --dim: #9fa1a8; --mark: #ff7a1a; --beta: #9db8ea;
  --head: "Bai Jamjuree", "Anuphan", system-ui, sans-serif;
  --text: "Anuphan", system-ui, -apple-system, "Thonburi", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f2f1ee; --surface: #ffffff; --line: #dedcd6; --fg: #18191c; --dim: #5f6168; --mark: #d9580a; --beta: #3a5fa8; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f2f1ee; --surface: #ffffff; --line: #dedcd6; --fg: #18191c; --dim: #5f6168; --mark: #d9580a; --beta: #3a5fa8; color-scheme: light; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 var(--text); }
.page { max-width: 1320px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.word { font: 700 20px var(--head); letter-spacing: .02em; text-decoration: none; }
.word small { font: 500 13px var(--text); color: var(--dim); margin-left: 10px; letter-spacing: 0; }
.lang { display: flex; gap: 2px; font: 500 14px var(--text); }
.lang button { background: none; border: 0; color: var(--dim); padding: 6px 10px; cursor: pointer; border-bottom: 2px solid transparent; font: inherit; }
.lang button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--mark); }

/* overview */
.intro { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; padding-block: 28px; align-items: end; }
.intro h1 { font: 600 clamp(30px, 4.4vw, 46px)/1.15 var(--head); margin: 0; text-wrap: balance; }
.intro p { margin: 0; color: var(--dim); max-width: 60ch; }
.intro .note { font-size: 14px; margin-top: 10px; }
.split { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.screen { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.shot { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #111; }
.shot img { display: block; width: 100%; height: auto; }
.spot { position: absolute; border: 3px solid var(--mark); border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); pointer-events: none; transition: all .25s ease; }
.hit { position: absolute; background: transparent; border: 0; cursor: pointer; padding: 0; }
.caption { margin-top: 12px; color: var(--dim); font-size: 14px; }
.index { display: grid; gap: 28px; min-width: 0; }
.group h2 { font: 600 14px var(--text); color: var(--dim); margin: 0 0 4px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; text-decoration: none; border-top: 1px solid var(--line); padding: 12px 0; }
.item .name { font: 600 18px/1.3 var(--head); display: flex; gap: 8px; align-items: baseline; }
.item .what { color: var(--dim); margin-top: 2px; }
.item .go { color: var(--dim); font-size: 20px; transition: transform .15s; }
.item:hover .name, .item:focus-visible .name { color: var(--mark); }
.item:hover .go { transform: translateX(3px); color: var(--mark); }
.beta { font: 500 12px var(--text); color: var(--beta); }
.start { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.start h3 { font: 600 17px var(--head); margin: 0 0 4px; }
.start p { margin: 0; color: var(--dim); font-size: 15px; }

/* detail */
.crumb { display: inline-flex; gap: 8px; align-items: center; margin-top: 22px; color: var(--dim); text-decoration: none; font-size: 15px; }
.crumb:hover { color: var(--fg); }
.dhead { padding-block: 12px 24px; display: grid; gap: 8px; max-width: 70ch; }
.dhead .where { font-size: 14px; color: var(--dim); }
.dhead h1 { font: 600 clamp(30px, 4.6vw, 48px)/1.12 var(--head); margin: 0; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.dhead h1 .beta { font-size: 15px; }
.dhead p { margin: 0; font-size: 18px; color: var(--fg); }
.dshot { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #111; position: relative; margin: 0; }
.dshot img { display: block; width: 100%; height: auto; }
.dshot figcaption { position: absolute; left: 12px; bottom: 12px; background: rgba(13,14,16,.82); color: #ececee; font-size: 13px; padding: 4px 10px; border-radius: 6px; }
.dbody { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; padding-top: 28px; }
.dbody h2 { font: 600 20px var(--head); margin: 0 0 8px; }
.dbody section + section { margin-top: 26px; }
.dbody p { margin: 0; }
.dbody ol, .dbody ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.dbody ol li::marker { color: var(--mark); font-weight: 600; font-family: var(--head); }
.dbody ul li::marker { color: var(--dim); }
.open { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.notes li { color: var(--dim); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 40px; border-top: 1px solid var(--line); padding-top: 16px; }
.pager a { text-decoration: none; display: grid; gap: 2px; padding: 8px 0; }
.pager a:last-child { text-align: right; }
.pager small { color: var(--dim); font-size: 13px; }
.pager b { font: 600 18px var(--head); }
.pager a:hover b { color: var(--mark); }
.deep { margin-top: 44px; border-top: 1px solid var(--line); }
.deep-title { font: 600 14px var(--text); color: var(--mark); padding-top: 18px; letter-spacing: .02em; }
.dsec { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 36px; padding-block: 26px; border-bottom: 1px solid var(--line); align-items: start; }
.dsec.noimg { grid-template-columns: minmax(0, 1fr); }
.dsec.noimg > div { max-width: 86ch; }
.dsec h2 { font: 600 24px/1.25 var(--head); margin: 0 0 10px; }
.dsec h3 { font: 600 15px var(--text); color: var(--dim); margin: 18px 0 8px; }
.dsec p { margin: 0 0 10px; }
.dsec .p2 { color: var(--dim); font-size: 15px; margin-top: 12px; }
.dsec ol, .dsec ul { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.dsec ol li::marker { color: var(--mark); font-weight: 600; font-family: var(--head); }
.dsec ul li::marker { color: var(--dim); }
.dfig { margin: 0; position: sticky; top: 16px; }
.dfig img { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); background: #111; }
.dfig figcaption { color: var(--dim); font-size: 14px; margin-top: 8px; }
.tbl { overflow-x: auto; margin-top: 4px; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th { text-align: left; font: 600 13px var(--text); color: var(--dim); padding: 6px 12px 6px 0; }
.tbl td { border-top: 1px solid var(--line); padding: 8px 12px 8px 0; vertical-align: top; }
.tbl td:first-child { font-weight: 600; }
.exs { display: grid; gap: 10px; margin-top: 4px; }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: grid; gap: 4px; }
.ex .k { display: inline-block; min-width: 3.6em; font: 600 12px var(--text); color: var(--mark); text-transform: uppercase; letter-spacing: .04em; }
.ex p { margin: 2px 0 0; color: var(--dim); font-size: 14px; }
footer { margin-top: 32px; color: var(--dim); font-size: 13px; }

/* sections */
.tabs { display: flex; gap: 4px; margin-right: auto; margin-left: 24px; font: 500 15px var(--text); }
.tabs a { text-decoration: none; color: var(--dim); padding: 6px 12px; border-radius: 8px; }
.tabs a[aria-current="page"] { color: var(--fg); background: var(--surface); }
.tabs a:hover { color: var(--fg); }

/* settings */
.screens { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
.screens a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; text-decoration: none; border-top: 1px solid var(--line); padding: 14px 0; }
.screens .name { font: 600 19px/1.3 var(--head); }
.screens .what { color: var(--dim); margin-top: 2px; }
.screens .count { color: var(--dim); font-size: 13px; white-space: nowrap; }
.screens a:hover .name { color: var(--mark); }
.pref-group { margin-top: 30px; }
.pref-group h2 { font: 600 14px var(--text); color: var(--dim); margin: 0 0 6px; }
.pref { display: grid; grid-template-columns: minmax(0, 15em) minmax(0, 1fr); gap: 6px 28px; border-top: 1px solid var(--line); padding: 14px 0; }
.pref .pname { font: 600 17px/1.35 var(--head); }
.pref .kind { display: inline-block; margin-top: 6px; font: 500 12px var(--text); color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 0 9px; }
.pref .kind.switch { color: var(--mark); border-color: color-mix(in srgb, var(--mark) 45%, transparent); }
.pref p { margin: 0; }
.pref .choices { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.pref .choices li { font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; }
.hidden-note { margin-top: 12px; color: var(--dim); font-size: 14px; }
@media (max-width: 920px) {
  .screens { grid-template-columns: minmax(0, 1fr); }
  .pref { grid-template-columns: minmax(0, 1fr); }
  .tabs { margin-left: 8px; }
  .word small { display: none; }
}

@media (max-width: 920px) {
  .intro, .split, .dbody, .dsec { grid-template-columns: minmax(0, 1fr); }
  .dfig { position: static; }
  .screen { top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 8px; z-index: 2; }
  .caption { display: none; }
  .start { grid-template-columns: minmax(0, 1fr); }
  .dbody { gap: 0; }
  .dbody > div + div { margin-top: 26px; }
}
@media (prefers-reduced-motion: reduce) { .spot, .item .go { transition: none; } }
</style>
</head>

    steps: ["แตะการ์ด หน้าปัดลอย แผงจะขึ้นมา", "ลากเพื่อย้าย ถ่างนิ้วเพื่อขยาย ดันชิดขอบจอเพื่อเก็บ ปุ่มลูกศรสลับแผงเล็กกับแผงเต็ม", "แตะปุ่มด้านล่างเพื่อใช้งาน", "ทางขวา: ปุ่มอัดเริ่ม/หยุดบันทึก พระจันทร์หรี่จอ (ลากบนปุ่มเพื่อปรับความมืด) ปุ่มปิดแอปต้องแตะสองครั้ง ครั้งแรกจะเป็นสีแดง"],

{ id: "macro", spot: "macro", group: "cards", img: "macro",

    open: "The switch on the Macro pad card, Settings → Floating windows, or the Macro pad on / off shortcut.",
    steps: ["Tap the switch on the Macro pad card. The pad appears at the bottom right.", "Tap the card itself to set it up: it shows a big copy of the pad.", "Tap a button there and pick its action from the same tabs as Shortcuts, or tap Clear to empty it. The pad changes straight away.", "On the pad: tap a button to run it. Drag to move, pinch to resize, push it to an edge to tuck it away."],

    notes: ["An empty button shows a plus; tapping it on the pad opens the picker for that button.", "The pad can't tell a hold from a tap, so Hold to speak works as tap on, tap off.", "7xDash needs permission to show over other apps. It asks the first time."] },
  th: { name: "แผงปุ่มลัด", what: "ปุ่ม 6 ปุ่มของเราเอง ลอยทับทุกแอป",
    intro: "แผงปุ่มเล็กๆ 6 ปุ่ม ลอยทับแผนที่ CarPlay หรือแอปอื่นได้ เหมือนหน้าปัดลอย เลือกเองได้ว่าแต่ละปุ่มทำอะไร เช่น อัดคลิป ถ่ายรูป จับภาพ กระจกมองหลัง หรี่จอ โทรโข่ง ประกาศ เพิ่มเสียง หรือเปิดไฟ",

    steps: ["แตะสวิตช์บนการ์ด แผงปุ่มลัด แพดจะขึ้นที่มุมขวาล่าง", "แตะตัวการ์ดเพื่อตั้งปุ่ม จะเห็นแพดแบบใหญ่", "แตะปุ่มที่อยากเปลี่ยน แล้วเลือกคำสั่งจากแท็บเดียวกับเมนูปุ่มลัด หรือกด ล้าง เพื่อเว้นว่าง แพดจะเปลี่ยนตามทันที", "บนแพด แตะปุ่มเพื่อสั่งงาน ลากเพื่อย้าย ถ่างนิ้วเพื่อขยาย ดันชิดขอบจอเพื่อเก็บ"],
    options: ["6 ปุ่ม แถวละ 3 สองแถว เริ่มต้นเป็น อัดคลิป ถ่ายรูป จับภาพทันที กระจกมองหลัง หรี่จอ และประกาศ", "ใช้คำสั่งไหนก็ได้ที่มีในปุ่มลัด รวมถึงเล่นเสียงประกาศที่เลือกไว้ และเปิด/ปิดหน้าปัดลอย", "จำขนาดและตำแหน่งไว้ให้"],

{ id: "automation", spot: "automation", group: "cards", img: "automation",
  en: { name: "Automation", what: "When something happens on the car, 7xDash does what you picked: drive mode, steering, lights, sunroof shade, navigation and more.",
    intro: "Each rule reads as one sentence: when [one event], and only if [up to four conditions], do [as many actions as you like, in order]. For example: it starts raining and it's dark → rear fog light on.",
    open: "The Automation card on Home.",
    steps: ["Tap the Automation card and switch on Run my automations. With it off, no rule runs.", "Tap Add automation, or tap one of the ready-made examples and change it.", "1. When this happens (left): pick one event, and its value if it has one, such as a speed.", "And only if (optional): add conditions such as weekdays or daylight.", "2. Do this (right): tap actions and their choices. Pick as many as you like; tap a choice again to take it off.", "Read the sentence at the bottom, tap Try it now while parked to see the car do it, then Save."],
    options: ["Every rule has its own switch. The main switch stops them all without deleting anything.", "Tap a rule to change it, or delete it from its edit page.", "Ready-made examples while the list is empty: leave a place → tailgate opening 50%, rain at night → rear fog light on, getting dark → mood light on."],
    notes: ["7xDash changes car settings while you drive, the drive mode included. Pick only what you are sure of, and try each rule while parked first.", "When a rule runs, a notice says what it did, e.g. Automation: Rear fog light: On. If something could not be done it says what and why, and the rule shows when it last ran.", "Every run and every value sent to the car goes in the black box, which Settings → System → Diagnostics exports."],
    more: [
      { h: "How a rule works", p: "When is a change, not a state: shifting into D, rain starting, leaving home. And only if is how things are at that moment: dark, a weekday, at home. Do this runs from top to bottom.", ex: [{ when: "Getting dark, and it is raining", do: "Rear fog light: On · Dim display: 50%" }] },
      { h: "Events: 1. When this happens", img: "automation-edit", cap: "Speed reaches 100 km/h → Drive mode: Sport · Steering feel: Heavy",
        rows: { cols: ["Group", "Event", "Values"], rows: [
          ["Car", "Turns on, Turns off", ""], ["Gear", "Shifted into P, D or R", ""], ["Speed", "Reaches … / Drops to …", "10–160 km/h in steps of 10"],
          ["Daylight", "Gets dark, Gets light (the car's day/night sensor)", ""], ["Rain", "Starts, Stops (the car's rain sensor)", ""], ["Battery", "Drops to …", "5–50% in steps of 5"],
          ["Outside temperature", "Reaches … / Drops to …", "−10 to 40 °C in steps of 5"], ["Place", "Arrive at, Leave", "Your saved places"]] },
        p2: "One event per rule. To do the same thing on several events, make one rule for each." },
      { h: "Conditions: And only if", img: "automation-conditions", cap: "Leave Home, and only on weekdays in daylight",
        p: "Optional. One choice per group, and every condition has to be true for the rule to run.",
        rows: { cols: ["Group", "Condition"], rows: [["Days", "Weekdays (Mon–Fri), Weekend (Sat–Sun), or pick days one by one"], ["Daylight", "Dark, Light"], ["Rain", "Raining, Not raining"], ["Place", "At [place], Away from [place]"]] },
        p2: "If the car has not sent that value yet (no GPS fix, day or night not known yet), the condition counts as not true. A rule never runs on a guess." },
      { h: "Actions: 2. Do this", img: "shortcut-picker-car", cap: "Shortcut actions include the sunroof shade, steering feel and the floating map",
        rows: { cols: ["Action", "Choices", "Good to know"], rows: [
          ["Drive mode", "Comfort, Normal, Sport", "Changes while driving. Be sure."], ["Steering feel", "Light, Balanced, Heavy", "The car's Custom mode setting"],
          ["Sunroof shade", "Closed, 25%, 50%, 75%, Open", "The car decides when it can move"], ["Tailgate opening height", "50–100%", "How far the power tailgate opens"],
          ["Rear fog light", "On, Off", "Headlights must be on"], ["AC", "On, Off", ""], ["Temperature zones", "Synced, Dual zone", ""],
          ["Glovebox", "Open", "Only in P"], ["Lock and unlock feedback", "Hazards only, + sound, + headlights, + light signal", ""],
          ["Mood light", "On, Off", "7xDash's Bluetooth RGB lights"], ["Mood light colour", "White, red, orange, yellow, green, cyan, blue, purple, pink", "Stays until a gear colour rule changes it"],
          ["Car ambient light", "On, Off, or one of the colours", "A colour turns it on in that colour"], ["Car ambient brightness", "1–10", ""],
          ["Dim display", "Off, 30%, 50%, 70%, 90%", ""], ["Navigate to", "A saved place", "Starts guiding at once; never replaces a trip in progress"],
          ["Shortcut action", "Any action from Shortcuts", "e.g. Recording start/stop, Floating map on / off, Outside speaker"]] },
        p2: "Shortcut actions that need a person there (both ways of speaking outside, the announcement picker) and Quit app (it would stop Automation too) are not offered. Automation sets a value instead of flipping it, because it can't know how the car was left: Rear fog light: On, not on/off. If the car already has that value, nothing is sent." },
      { h: "Places (home, work…)", list: [
          "Save a place in the edit page: pick the Place group → Save this spot (the car's GPS position now), then name it.",
          "Or on the Navigation screen: pick a destination, then Save place. Automation and Navigation share the same places.",
          "Arrive counts within 150 m. Leave counts beyond 250 m, 100 m further out so GPS wobble at the edge doesn't count you in and out again and again.",
          "While a rule uses a place, 7xDash reads the car's GPS in the background, even without navigating.",
          "Hold a place to delete it. Rules that use it stop working."] },
      { h: "Rules worth knowing", ol: [
          "It runs on a change, not a state. Opening the app while in D does not run Shifted into D; you have to change gear. The exception is Car turns on, right as the screen wakes with the car.",
          "A number has to go back before it runs again. After Speed reaches 80, the speed has to drop at least 3 km/h first (battery and temperature: 1).",
          "30 seconds apart. Number and rain rules run at most every 30 seconds, so cruising around 80 km/h doesn't flip modes, and a drizzle doesn't fire it over and over.",
          "Unknown values don't count. If the car has not sent a value, it is not a change, and a condition on it is not true.",
          "Several rules can run at once, in list order. If two set the same thing, the lower one wins.",
          "Turn off the main switch when you want nothing to run. Your rules stay."] },
      { h: "Real-life examples", ex: [
          { g: "Commute", when: "Leave Home, on weekdays", do: "Navigate to Work", note: "Drive out on a weekday morning and guidance starts with live traffic and battery at arrival, without touching the screen." },
          { when: "Leave Work, on weekdays", do: "Navigate to Home · Shortcut: Floating map on / off", note: "Guidance home as a floating map, so music or CarPlay keeps the screen." },
          { g: "City and motorway", when: "Speed reaches 100 km/h", do: "Drive mode: Sport · Steering feel: Heavy" },
          { when: "Speed drops to 60 km/h", do: "Drive mode: Comfort · Steering feel: Light", note: "Use the pair: heavy and steady at speed, light for city turns. 40 km/h apart, so it doesn't flip back and forth." },
          { when: "Shifted into R", do: "Steering feel: Light", note: "Easier parking." },
          { g: "Weather", when: "Rain starts, when dark", do: "Rear fog light: On", note: "Pair it with Rain stops → Rear fog light: Off. The car needs the headlights on; if not, the notice says so." },
          { when: "Outside temperature reaches 35 °C, in daylight", do: "Sunroof shade: Closed · AC: On" },
          { when: "Outside temperature drops to 25 °C, not raining", do: "Sunroof shade: 50%" },
          { g: "Day and night", when: "Gets dark", do: "Dim display: 50% · Car ambient light: orange · Car ambient brightness: 3", note: "And Gets light → Dim display: Off." },
          { g: "Parking and home", when: "Shifted into P, at Home", do: "Tailgate opening height: 70%", note: "The tailgate stops below the garage ceiling. Add Leave Home → 100% for everywhere else." },
          { when: "Arrive at Home", do: "Lock feedback: Hazards only", note: "And Leave Home → Hazards + sound. No beeps for the neighbours at night; still a sound in public car parks." },
          { when: "Car turns off, in daylight", do: "Sunroof shade: Closed" },
          { g: "Cameras and battery", when: "Shifted into D", do: "Shortcut: Recording start/stop", note: "This one flips, so skip it if Record on launch is on. D, not Car turns on, because that runs once per drive." },
          { when: "Battery drops to 15%", do: "Drive mode: Comfort · AC: Off · Mood light: Off" },
          { g: "Start of the day", when: "Car turns on, on weekdays, in daylight", do: "AC: On · Temperature zones: Synced · Drive mode: Normal" },
          { when: "Car turns on, at the weekend", do: "Drive mode: Sport · Car ambient light: blue" }] },
      { h: "When it doesn't run", rows: { cols: ["What you see", "Why"], rows: [
          ["Nothing ever runs", "Run my automations is off, or 7xDash was closed (Settings → System → Start on boot)."],
          ["Shifted into D did nothing when the app opened", "It runs on a real gear change, not on the gear at start."],
          ["It ran only once", "A number has to go back first, and rules are 30 s apart."],
          ["A place rule doesn't run", "No GPS yet, the place was deleted, or it was saved more than 150 m from where you park."],
          ["Not everything was done: …", "The car refused in that state, e.g. the glovebox outside P, the fog light with headlights off."],
          ["Already navigating", "A trip is in progress; Navigate to never replaces it."]] } }
    ] },
  th: { name: "ระบบอัตโนมัติ", what: "เมื่อเกิดเหตุการณ์กับรถ 7xDash จะทำสิ่งที่คุณเลือกให้เอง: โหมดขับขี่ พวงมาลัย ไฟ ม่านซันรูฟ นำทาง และอื่นๆ",
    intro: "แต่ละรายการอ่านเป็นประโยคเดียว: เมื่อ [เหตุการณ์ 1 อย่าง] และเฉพาะเมื่อ [เงื่อนไขไม่เกิน 4 อย่าง] ให้ทำ [คำสั่งกี่อย่างก็ได้ ตามลำดับ] เช่น ฝนเริ่มตกตอนมืด → เปิดไฟตัดหมอกหลัง",
    open: "การ์ด ระบบอัตโนมัติ ในหน้าหลัก",
    steps: ["แตะการ์ด ระบบอัตโนมัติ แล้วเปิดสวิตช์ เปิดใช้ระบบอัตโนมัติ ถ้าปิดอยู่จะไม่มีรายการไหนทำงาน", "กด เพิ่มรายการ หรือแตะตัวอย่างที่แอปเตรียมไว้แล้วแก้ต่อ", "1. เมื่อ (ซ้าย): เลือกเหตุการณ์ 1 อย่าง ถ้ามีค่า เช่น ความเร็ว ให้เลือกค่าด้วย", "และเฉพาะเมื่อ (ไม่บังคับ): เพิ่มเงื่อนไข เช่น วันทำงาน หรือตอนสว่าง", "2. ให้ทำ (ขวา): แตะคำสั่งและตัวเลือก เลือกได้หลายอย่าง แตะตัวเลือกเดิมอีกครั้งเพื่อเอาออก", "อ่านประโยคสรุปด้านล่าง กด ลองเลย ตอนจอดเพื่อดูว่ารถทำตามจริง แล้วกด บันทึก"],
    options: ["แต่ละรายการมีสวิตช์ของตัวเอง สวิตช์หลักหยุดทุกรายการโดยไม่ลบอะไร", "แตะรายการเพื่อแก้ไข หรือลบจากหน้าแก้ไข", "ตัวอย่างสำเร็จรูปตอนยังไม่มีรายการ: ออกจากสถานที่ → ความสูงการเปิดฝาท้าย 50%, ฝนตกตอนมืด → เปิดไฟตัดหมอกหลัง, เริ่มมืด → เปิดไฟบรรยากาศ"],
    notes: ["7xDash จะเปลี่ยนการตั้งค่ารถระหว่างขับ รวมถึงโหมดขับขี่ เลือกเฉพาะที่มั่นใจ และลองตอนจอดก่อนทุกครั้ง", "เมื่อรายการทำงานจะมีข้อความบอก เช่น ระบบอัตโนมัติ: ไฟตัดหมอกหลัง: เปิด ถ้าบางคำสั่งทำไม่ได้จะบอกว่าอะไรและเพราะอะไร และแต่ละรายการจะแสดงเวลาที่ทำงานล่าสุด", "ทุกครั้งที่ทำงานและทุกค่าที่ส่งให้รถ บันทึกลงกล่องดำ ส่งออกได้จาก ตั้งค่า → ระบบ → การวินิจฉัย"],
    more: [
      { h: "หลักการทำงาน", p: "เมื่อ คือการเปลี่ยนแปลง ไม่ใช่สภาพ เช่น เข้าเกียร์ D ฝนเริ่มตก ออกจากบ้าน ส่วน และเฉพาะเมื่อ คือสภาพตอนนั้น เช่น ตอนมืด วันทำงาน อยู่ที่บ้าน และ ให้ทำ จะทำต่อกันจากบนลงล่าง", ex: [{ when: "เริ่มมืด และฝนตกอยู่", do: "ไฟตัดหมอกหลัง: เปิด · หรี่จอ: 50%" }] },
      { h: "เหตุการณ์: 1. เมื่อ", img: "automation-edit", cap: "ความเร็วถึง 100 กม./ชม. → โหมดขับขี่ Sport · น้ำหนักพวงมาลัย หนัก",
        rows: { cols: ["กลุ่ม", "เหตุการณ์", "ค่าที่เลือกได้"], rows: [
          ["รถ", "สตาร์ทรถ, ดับรถ", ""], ["เกียร์", "เข้าเกียร์ P, D หรือ R", ""], ["ความเร็ว", "ความเร็วถึง … / ลดเหลือ …", "10–160 กม./ชม. ทีละ 10"],
          ["แสงภายนอก", "เริ่มมืด, เริ่มสว่าง (เซนเซอร์กลางวัน/กลางคืนของรถ)", ""], ["ฝน", "ฝนเริ่มตก, ฝนหยุดตก (เซนเซอร์ฝนของรถ)", ""], ["แบตเตอรี่", "แบตเหลือ …", "5–50% ทีละ 5"],
          ["อุณหภูมินอกรถ", "ถึง … / ลดเหลือ …", "−10 ถึง 40 °C ทีละ 5"], ["สถานที่", "ถึง, ออกจาก", "สถานที่ที่บันทึกไว้"]] },
        p2: "เลือกได้รายการละ 1 เหตุการณ์ ถ้าอยากให้หลายเหตุการณ์ทำสิ่งเดียวกัน ให้สร้างหลายรายการ" },
      { h: "เงื่อนไข: และเฉพาะเมื่อ", img: "automation-conditions", cap: "ออกจาก Home เฉพาะวันทำงานตอนสว่าง",
        p: "ไม่บังคับ แต่ละกลุ่มเลือกได้ 1 อย่าง และทุกเงื่อนไขต้องเป็นจริง รายการถึงจะทำงาน",
        rows: { cols: ["กลุ่ม", "เงื่อนไข"], rows: [["วัน", "วันทำงาน (จ–ศ), วันหยุดสุดสัปดาห์ (ส–อา) หรือเลือกเองทีละวัน"], ["แสงภายนอก", "ตอนมืด, ตอนสว่าง"], ["ฝน", "ฝนตกอยู่, ฝนไม่ตก"], ["สถานที่", "อยู่ที่ [สถานที่], ไม่ได้อยู่ที่ [สถานที่]"]] },
        p2: "ถ้ารถยังไม่ได้ส่งค่านั้นมา (ยังไม่มี GPS หรือยังไม่รู้ว่ามืดหรือสว่าง) เงื่อนไขนั้นนับว่าไม่จริง รายการจะไม่ทำงานจากการเดา" },
      { h: "คำสั่ง: 2. ให้ทำ", img: "shortcut-picker-car", cap: "คำสั่งปุ่มลัดมีม่านซันรูฟ น้ำหนักพวงมาลัย และแผนที่ลอย",
        rows: { cols: ["คำสั่ง", "ตัวเลือก", "ควรรู้"], rows: [
          ["โหมดขับขี่", "Comfort, Normal, Sport", "เปลี่ยนได้ขณะขับ เลือกให้มั่นใจ"], ["น้ำหนักพวงมาลัย", "เบา, สมดุล, หนัก", "ค่าของโหมด Custom ของรถ"],
          ["ม่านซันรูฟ", "ปิด, 25%, 50%, 75%, เปิดสุด", "รถเป็นคนตัดสินว่าขยับได้เมื่อไร"], ["ความสูงการเปิดฝาท้าย", "50–100%", "ฝาท้ายไฟฟ้าจะเปิดสูงสุดเท่านี้"],
          ["ไฟตัดหมอกหลัง", "เปิด, ปิด", "ต้องเปิดไฟหน้าอยู่"], ["แอร์", "เปิด, ปิด", ""], ["อุณหภูมิซ้าย-ขวา", "เท่ากัน, แยกกัน", ""],
          ["ช่องเก็บของหน้ารถ", "เปิด", "เฉพาะเกียร์ P"], ["การตอบสนองตอนล็อก/ปลดล็อก", "ไฟฉุกเฉินเท่านั้น, + เสียง, + ไฟหน้า, + สัญญาณไฟ", ""],
          ["ไฟบรรยากาศ", "เปิด, ปิด", "ไฟ RGB บลูทูธของ 7xDash"], ["สีไฟบรรยากาศ", "ขาว แดง ส้ม เหลือง เขียว ฟ้า น้ำเงิน ม่วง ชมพู", "ค้างจนกว่ากฎสีตามเกียร์จะเปลี่ยน"],
          ["ไฟ Ambient ของรถ", "เปิด, ปิด หรือเลือกสี", "เลือกสี = เปิดพร้อมสีนั้น"], ["ความสว่างไฟ Ambient", "1–10", ""],
          ["หรี่จอ", "ปิด, 30%, 50%, 70%, 90%", ""], ["นำทางไปที่", "สถานที่ที่บันทึกไว้", "เริ่มนำทางทันที ไม่แทรกทริปที่กำลังนำทาง"],
          ["คำสั่งปุ่มลัด", "ทุกคำสั่งในหน้าปุ่มลัด", "เช่น เริ่ม/หยุดบันทึก, เปิด/ปิดแผนที่ลอย, ลำโพงนอกรถ"]] },
        p2: "คำสั่งปุ่มลัดที่ต้องมีคนอยู่ด้วย (พูดออกนอกรถทั้งสองแบบ ตัวเลือกประกาศ) และ ออกจากแอป (จะหยุดระบบอัตโนมัติไปด้วย) จะไม่มีให้เลือก ระบบอัตโนมัติสั่งเป็นค่าที่แน่นอนแทนการสลับ เพราะไม่รู้ว่ารถถูกทิ้งไว้ในสภาพไหน เช่น ไฟตัดหมอกหลัง: เปิด ถ้ารถอยู่ในค่านั้นแล้วจะไม่ส่งซ้ำ" },
      { h: "สถานที่ (บ้าน ที่ทำงาน…)", list: [
          "บันทึกในหน้าแก้ไข: เลือกกลุ่มสถานที่ → บันทึกจุดนี้ (ใช้ตำแหน่ง GPS ของรถตอนนี้) แล้วตั้งชื่อ",
          "หรือในหน้านำทาง: เลือกที่หมายแล้วกด บันทึกสถานที่ ระบบอัตโนมัติกับการนำทางใช้สถานที่ชุดเดียวกัน",
          "นับว่า ถึง เมื่อเข้าใกล้ไม่เกิน 150 ม. และนับว่า ออก เมื่อห่างเกิน 250 ม. เผื่อไว้อีก 100 ม. กัน GPS แกว่งที่ขอบแล้วนับเข้า-ออกซ้ำๆ",
          "ขณะมีรายการที่ใช้สถานที่ 7xDash จะอ่าน GPS ของรถอยู่เบื้องหลัง แม้ไม่ได้นำทาง",
          "กดค้างที่สถานที่เพื่อลบ รายการที่ใช้สถานที่นั้นจะหยุดทำงาน"] },
      { h: "กฎที่ควรรู้", ol: [
          "ทำงานเมื่อมีการเปลี่ยนแปลง ไม่ใช่สภาพ เปิดแอปตอนอยู่เกียร์ D แล้ว เข้าเกียร์ D จะไม่ทำงาน ต้องเปลี่ยนเกียร์จริง ยกเว้น สตาร์ทรถ ตอนจอเพิ่งตื่นพร้อมรถ",
          "ตัวเลขต้องกลับก่อนจะทำงานอีก หลัง ความเร็วถึง 80 ความเร็วต้องลดลงอย่างน้อย 3 กม./ชม. ก่อน (แบตและอุณหภูมิ 1 หน่วย)",
          "เว้นระยะ 30 วินาที รายการแบบตัวเลขและฝนทำงานไม่ถี่กว่า 30 วินาทีต่อครั้ง ขับวนแถว 80 กม./ชม. จะไม่สลับโหมดไปมา ฝนปรอยๆ ก็ไม่ทำงานรัว",
          "ค่าที่ไม่รู้ไม่นับ ถ้ารถยังไม่ส่งค่ามา จะไม่ถือว่าเปลี่ยน และเงื่อนไขนับว่าไม่จริง",
          "หลายรายการทำงานพร้อมกันได้ ตามลำดับในรายการ ถ้าสองรายการสั่งสิ่งเดียวกัน รายการล่างชนะ",
          "ปิดสวิตช์หลักเมื่อไม่อยากให้อะไรทำงาน รายการยังอยู่ครบ"] },
      { h: "ตัวอย่างที่ใช้จริง", ex: [
          { g: "เดินทางประจำวัน", when: "ออกจาก บ้าน เฉพาะวันทำงาน", do: "นำทางไปที่ ที่ทำงาน", note: "ขับออกจากบ้านเช้าวันทำงาน แผนที่เริ่มนำทางพร้อมจราจรสดและแบตเมื่อถึงเอง ไม่ต้องแตะจอ" },
          { when: "ออกจาก ที่ทำงาน เฉพาะวันทำงาน", do: "นำทางไปที่ บ้าน · ปุ่มลัด: เปิด/ปิดแผนที่ลอย", note: "นำทางกลับบ้านแบบแผนที่ลอย ใช้จอกับเพลงหรือ CarPlay ต่อได้" },
          { g: "ในเมือง และทางด่วน", when: "ความเร็วถึง 100 กม./ชม.", do: "โหมดขับขี่: Sport · น้ำหนักพวงมาลัย: หนัก" },
          { when: "ความเร็วลดเหลือ 60 กม./ชม.", do: "โหมดขับขี่: Comfort · น้ำหนักพวงมาลัย: เบา", note: "ใช้คู่กัน หนักนิ่งที่ความเร็วสูง เบาตอนเลี้ยวในเมือง ห่างกัน 40 กม./ชม. จึงไม่สลับไปมา" },
          { when: "เข้าเกียร์ R", do: "น้ำหนักพวงมาลัย: เบา", note: "ถอยจอดง่ายขึ้น" },
          { g: "สภาพอากาศ", when: "ฝนเริ่มตก เฉพาะตอนมืด", do: "ไฟตัดหมอกหลัง: เปิด", note: "คู่กับ ฝนหยุดตก → ไฟตัดหมอกหลัง: ปิด ต้องเปิดไฟหน้าอยู่ ถ้ายังไม่เปิด ข้อความจะบอก" },
          { when: "อุณหภูมินอกรถถึง 35 °C เฉพาะตอนสว่าง", do: "ม่านซันรูฟ: ปิด · แอร์: เปิด" },
          { when: "อุณหภูมินอกรถลดเหลือ 25 °C เฉพาะตอนฝนไม่ตก", do: "ม่านซันรูฟ: 50%" },
          { g: "กลางวัน / กลางคืน", when: "เริ่มมืด", do: "หรี่จอ: 50% · ไฟ Ambient ของรถ: ส้ม · ความสว่างไฟ Ambient: 3", note: "และ เริ่มสว่าง → หรี่จอ: ปิด" },
          { g: "จอดรถ และถึงบ้าน", when: "เข้าเกียร์ P เฉพาะตอนอยู่ที่ บ้าน", do: "ความสูงการเปิดฝาท้าย: 70%", note: "ฝาท้ายเปิดไม่ชนเพดานโรงรถ เพิ่ม ออกจาก บ้าน → 100% สำหรับที่อื่น" },
          { when: "ถึง บ้าน", do: "การตอบสนองตอนล็อก: ไฟฉุกเฉินเท่านั้น", note: "คู่กับ ออกจาก บ้าน → ไฟฉุกเฉิน + เสียง ไม่มีเสียงบี๊บกวนเพื่อนบ้านตอนดึก แต่ที่จอดสาธารณะยังได้ยิน" },
          { when: "ดับรถ เฉพาะตอนสว่าง", do: "ม่านซันรูฟ: ปิด" },
          { g: "กล้อง และแบตเตอรี่", when: "เข้าเกียร์ D", do: "ปุ่มลัด: เริ่ม/หยุดบันทึก", note: "คำสั่งนี้เป็นแบบสลับ ถ้าเปิด บันทึกเมื่อเปิดแอป ไว้แล้วไม่ต้องใช้ ใช้เกียร์ D ไม่ใช่สตาร์ทรถ เพราะสตาร์ทรถทำงานครั้งเดียวต่อการขับ" },
          { when: "แบตเหลือ 15%", do: "โหมดขับขี่: Comfort · แอร์: ปิด · ไฟบรรยากาศ: ปิด" },
          { g: "เริ่มต้นวัน", when: "สตาร์ทรถ เฉพาะวันทำงานตอนสว่าง", do: "แอร์: เปิด · อุณหภูมิซ้าย-ขวา: เท่ากัน · โหมดขับขี่: Normal" },
          { when: "สตาร์ทรถ เฉพาะวันหยุดสุดสัปดาห์", do: "โหมดขับขี่: Sport · ไฟ Ambient ของรถ: น้ำเงิน" }] },
      { h: "ถ้าไม่ทำงาน", rows: { cols: ["อาการ", "สาเหตุ"], rows: [
          ["ไม่มีอะไรทำงานเลย", "สวิตช์ เปิดใช้ระบบอัตโนมัติ ปิดอยู่ หรือ 7xDash ถูกปิด (ตั้งค่า → ระบบ → เริ่มเมื่อเปิดเครื่อง)"],
          ["เข้าเกียร์ D ไม่ทำงานตอนเปิดแอป", "ทำงานเฉพาะตอนเปลี่ยนเกียร์จริง ไม่ใช่เกียร์ตอนเปิดแอป"],
          ["ทำงานแค่ครั้งแรก", "ค่าตัวเลขต้องกลับไปอีกฝั่งก่อน และเว้น 30 วินาที"],
          ["สถานที่ไม่ทำงาน", "ยังไม่มี GPS สถานที่ถูกลบ หรือบันทึกไว้ห่างจากที่จอดจริงเกิน 150 ม."],
          ["ทำงานไม่ครบ: …", "รถไม่รับคำสั่งในสภาพนั้น เช่น ช่องเก็บของนอกเกียร์ P ไฟตัดหมอกตอนไม่เปิดไฟหน้า"],
          ["กำลังนำทางอยู่แล้ว", "มีทริปค้างอยู่ คำสั่งนำทางไม่แทรกทริปเดิม"]] } }
    ] } },

{ id: "navigation", spot: "navigation", group: "cards", img: "nav-guiding",
  en: { name: "Navigation", what: "Turn-by-turn with TomTom: live traffic, up to three routes, battery at arrival, the next turn and a map on the HUD, and a floating map.",
    intro: "Turn-by-turn navigation on the car's screen, with routes and live traffic from TomTom. It puts the next turn and a small map on the HUD, tells you the battery left when you arrive, and can float over other apps so music or CarPlay keeps the screen.",
    open: "The Navigation card on Home. While guiding, the card shows the km to go and the arrival time.",
    steps: ["Tap the Navigation card.", "Type a place in Search places, or touch and hold the map to drop a pin.", "Pick one of up to three routes. Recommended is the fastest with the traffic right now.", "Tap Start. You can close the screen at any time: guidance goes on in the HUD, the floating map and the Dash panel.", "At the destination it says Arrived for 15 seconds and ends by itself. The × ends it early."],
    options: ["Settings on the route card, or ⚙ on the floating map: next turn on the HUD, map on the HUD, place on the HUD, map colours, car colour, places from the iPhone.", "Save place keeps the destination for next time, and for Automation."],
    notes: ["Needs internet for search, routes and traffic, and the car's GPS. Until there is a fix it says Waiting for GPS from the car.", "No spoken turns yet: the head unit's audio made guidance freeze, so it is off. The HUD card does the job.", "Builds from GitHub Releases have the TomTom key. If you build it yourself, set TOMTOM_API_KEY."],
    more: [
      { h: "The Navigation screen", img: "nav-idle", cap: "Search at the top left, the HUD preview at the top right",
        rows: { cols: ["Part", "Where", "What it does"], rows: [
          ["Search places", "Top left", "Type a place. Tap it while empty to see recent and saved places."],
          ["Map", "Full screen", "Drag, pinch, rotate. Touch and hold to drop a pin."],
          ["Route card", "Bottom left", "Destination; time · km · arrival; battery at arrival; routes; Start, Cancel, Settings, Save place."],
          ["Turn bar", "Top, while guiding", "Arrow, distance to the next turn, the instruction."],
          ["HUD preview", "Top right", "How the card on the HUD will look (can be hidden in Settings)."],
          ["+ / −", "Bottom right", "Zoom."],
          ["Floating window", "Bottom right corner", "Moves the map into a floating window and closes this screen."]] } },
      { h: "Five ways to pick a destination", img: "nav-search", cap: "Search results for Siam Paragon",
        ol: [
          "Search: up to six results from TomTom with addresses, Thai or English, nearest to the car first.",
          "Touch and hold the map: a Dropped pin and its route at once. Handy for a back gate with no name.",
          "Saved places: tap the empty search box. Save the current destination with Save place on the route card.",
          "From the iPhone: in Google Maps or Apple Maps, Share → Send to 7xDash. The Navigation screen opens with the place on top of Recent; pick it to see the route. A trip you are guiding is not switched.",
          "From 7xDash web: on the Remote view page, paste a Google Maps or Apple Maps link, coordinates, or type a name. Good for a passenger without an iPhone."] },
      { h: "Before you go: pick a route", img: "nav-preview", cap: "Three routes; the recommended one is selected. Start to go.",
        list: [
          "Up to three routes from TomTom. Recommended is the best with traffic now. Tap a card, or a grey line on the map, to take another.",
          "Times include live traffic.",
          "The card shows time · distance · arrival time, and the battery you'll have when you get there.",
          "Start to go, or Cancel. If no route was found there is a Try again button."] },
      { h: "While guiding", img: "nav-guiding", cap: "The 3D map follows the car. Time, km, arrival and battery at the bottom left; × ends the trip.",
        list: [
          "The turn bar shows the arrow, the distance to the next turn (300 m) and the instruction (Turn right onto Rama I Rd). A second line adds things like Motorway or Destination on the left.",
          "The 3D map turns with the car. Drag it away and Back to car brings it back. + / − are remembered for the next trip.",
          "Off the route by more than 45 m three fixes in a row: Rerouting… and a new route from where you are, at most every 10 seconds (GPS wobbles in car parks).",
          "Every 10 minutes it asks TomTom again for fresh traffic and arrival time.",
          "Close the screen and guidance goes on in the HUD, the floating map and the Dash panel; a notification says Navigating until you arrive or tap End.",
          "Within 30 m of the destination it shows Arrived for 15 seconds, then ends by itself."] },
      { h: "Battery at arrival", p: "Worked out from the battery and range the car reports, against the distance left. It updates all the way.",
        rows: { cols: ["It shows", "Meaning", "Colour"], rows: [
          ["64% left at arrival", "Enough", "Normal"], ["12% left at arrival", "Under 15%", "Orange"],
          ["40 km short: charge on the way", "You won't make it", "Red"], ["Battery at arrival: waiting for the car", "No value from the car yet", "Normal"]] },
        p2: "It shows on the route card, on the HUD (Arrive 14:35 · 64%), as a chip on the floating map and on the Dash panel." },
      { h: "Floating map", img: "nav-float-window", cap: "The floating map on the right; Home or any app stays usable on the left",
        list: [
          "Open it with the Floating window button on the Navigation screen, or the Floating map on / off shortcut (steering wheel, Macro pad or Automation). Allow Display over other apps the first time.",
          "Top left: the next turn and its distance. Top right: Arrive 10:14 AM, and under it the time and km left (20 min · 5.0 km).",
          "The battery chip shows battery at arrival in its colour.",
          "⚙ opens the navigation settings beside the window. ⛶ goes back to the full screen. ✕ closes the window; guidance carries on in the HUD.",
          "− / + zoom, remembered while guiding. Drag the corner to change width and height.",
          "Drag the top bar to move it, push it to a screen edge to tuck it away, double-tap the bar to switch small (about a third of the screen) and large (about 60%).",
          "One map at a time: opening the full screen closes the floating one.",
          "While the blind-spot camera pops up, the map draws less often so the camera picture stays smooth, then goes back to normal."] },
      { h: "Navigation settings", img: "nav-float-settings", cap: "⚙ on the floating map opens the settings beside it",
        rows: { cols: ["Group", "Setting", "Choices"], rows: [
          ["Voice and HUD", "Next turn on the HUD", "On / off"], ["", "Map on the HUD", "On / off"], ["", "Place on the HUD", "Full screen only"], ["", "Show the HUD card on the map", "On / off (full screen only)"],
          ["Map", "Map colours", "Follow screen, Light, Dark, Space"], ["", "Car colour", "Forest green, Silver, Black, White"],
          ["iPhone", "Go to places shared from the iPhone", "On / off"], ["", "Set up your iPhone", "QR code (full screen only)"]] },
        p2: "Follow screen changes with the head unit's day and night. Space is a city at night, with buildings dark at the base and lit towards the top." },
      { h: "On the HUD", img: "nav-hud-place", cap: "Place on the HUD: map on the left, turn card on the right; drag the orange corner to resize",
        list: [
          "Next turn on the HUD shows the arrow and distance, the instruction or Rerouting…, and the trip: Arrive 21:42 · 64%, orange when low, red when you won't make it. At the end: Arrived and the destination.",
          "Map on the HUD adds a small map beside the card. Zoom it with the HUD map zoom in / out shortcuts, or HUD map zoom: normal / far (one button, for motorways). The zoom is kept for next time.",
          "Place on the HUD (from the full screen settings): a small HUD with the card and map. Drag to move, drag the orange corner to resize; the real HUD follows. Reset puts it back, Done saves.",
          "Show the HUD card on the map puts a sample card at the top right of the Navigation screen, so you can see the look. It hides while guiding."] },
      { h: "With shortcuts and Automation", list: [
          "Shortcuts (steering wheel, smart sticker or Macro pad): Floating map on / off; HUD map zoom in, zoom out, and normal / far.",
          "Automation: the Navigate to [saved place] action starts guiding with no need to tap Start. It never replaces a trip in progress.",
          "Automation events Arrive at and Leave use the same saved places."],
        ex: [{ when: "Leave Home, on weekdays", do: "Navigate to Work" }, { when: "Leave Work, on weekdays", do: "Navigate to Home · Shortcut: Floating map on / off" }, { when: "Speed reaches 100 km/h", do: "Shortcut: HUD map zoom: normal / far" }] },
      { h: "Set up your iPhone", img: "nav-iphone", cap: "Scan this QR code with the iPhone camera (the address differs in every car)",
        p: "Once. The iPhone has to be on the car's Wi-Fi, which wireless CarPlay does. A cable connection can't reach 7xDash.",
        ol: ["Connect CarPlay wirelessly.", "Navigation → Settings → Set up your iPhone, and scan the QR code with the iPhone camera.", "The page that opens can send a place straight away: paste a link or type a name, then Send to 7xDash. Share → Add to Home Screen keeps it one tap away.", "For the share menu, make a Shortcut: in Shortcuts tap +, name it Send to 7xDash, turn on Show in Share Sheet, add Get Contents of URL with the address from the page, Method POST, Request Body Form, a Text field named link set to Shortcut Input.", "Then in Google Maps or Apple Maps open the place, tap Share, and pick Send to 7xDash."] },
      { h: "When something's wrong", rows: { cols: ["What you see", "Why / what to do"], rows: [
          ["Waiting for GPS from the car… for long", "No GPS signal yet (indoors, underground). Drive out into the open."],
          ["No internet: can't reach TomTom", "Check the car's internet, or share a phone hotspot with the head unit."],
          ["TomTom found no road to there", "The pin is in water, inside a building or has no road. Drop it closer to a road."],
          ["This build has no TomTom key", "Built without TOMTOM_API_KEY. Use a build from GitHub Releases."],
          ["Floating window doesn't open", "Allow Display over other apps for 7xDash and tap again."],
          ["No card on the HUD", "Turn on Next turn on the HUD, and check it isn't placed off screen (Place on the HUD → Reset)."],
          ["Nothing happens when sending from the iPhone", "The iPhone must be on the car's Wi-Fi (wireless CarPlay) and Go to places shared from the iPhone on."],
          ["Got it from the phone but couldn't find the place", "The link has no coordinates or searchable name. Share from the place's page, not the directions page."]] } }
    ] },
  th: { name: "นำทาง", what: "นำทางทีละจุดด้วย TomTom: จราจรสด เส้นทางให้เลือกสูงสุด 3 เส้น แบตเมื่อถึง ทางเลี้ยวถัดไปและแผนที่บน HUD และแผนที่ลอย",
    intro: "นำทางทีละจุดบนจอรถ เส้นทางและจราจรสดจาก TomTom แสดงทางเลี้ยวถัดไปกับแผนที่เล็กบน HUD บอกแบตที่จะเหลือเมื่อถึง และลอยทับแอปอื่นได้ เพลงหรือ CarPlay จะได้ใช้จอต่อ",
    open: "การ์ด นำทาง ในหน้าหลัก ขณะนำทางการ์ดจะบอกระยะที่เหลือและเวลาถึง",
    steps: ["แตะการ์ด นำทาง", "พิมพ์ชื่อสถานที่ในช่อง ค้นหาสถานที่ หรือแตะค้างบนแผนที่เพื่อปักหมุด", "เลือกเส้นทางจากสูงสุด 3 เส้น เส้น แนะนำ คือเส้นที่เร็วที่สุดตามจราจรตอนนั้น", "กด เริ่ม ปิดหน้าจอนี้ได้ทุกเมื่อ การนำทางจะทำต่อบน HUD แผนที่ลอย และหน้าปัดลอย", "ถึงที่หมายจะขึ้น ถึงแล้ว 15 วินาที แล้วจบเอง กด × เพื่อจบก่อน"],
    options: ["ปุ่ม ตั้งค่า ในการ์ดเส้นทาง หรือ ⚙ บนแผนที่ลอย: ทางเลี้ยวถัดไปบน HUD แผนที่บน HUD จัดตำแหน่งบน HUD สีแผนที่ สีรถ และสถานที่จาก iPhone", "บันทึกสถานที่ เก็บที่หมายไว้ใช้ครั้งหน้า และใช้ในระบบอัตโนมัติ"],
    notes: ["ต้องมีอินเทอร์เน็ตสำหรับค้นหา หาเส้นทาง และจราจร และต้องมี GPS ของรถ ถ้ายังไม่มีจะขึ้นว่า กำลังรอ GPS จากรถ", "ยังไม่มีเสียงบอกทาง ระบบเสียงของจอรถทำให้การนำทางค้าง จึงปิดไว้ ใช้การ์ดบน HUD แทน", "บิลด์จาก GitHub Releases มีคีย์ TomTom แล้ว ถ้าบิลด์เองต้องใส่ TOMTOM_API_KEY"],
    more: [
      { h: "หน้าจอนำทาง", img: "nav-idle", cap: "ช่องค้นหาซ้ายบน ตัวอย่าง HUD ขวาบน",
        rows: { cols: ["ส่วน", "ตำแหน่ง", "ทำอะไร"], rows: [
          ["ค้นหาสถานที่", "บนซ้าย", "พิมพ์ชื่อสถานที่ แตะตอนว่างเพื่อดูสถานที่ล่าสุดและที่บันทึกไว้"],
          ["แผนที่", "เต็มจอ", "ลาก ถ่าง หมุน แตะค้างเพื่อปักหมุด"],
          ["การ์ดเส้นทาง", "ล่างซ้าย", "ที่หมาย เวลา · ระยะ · เวลาถึง แบตเมื่อถึง เส้นทาง ปุ่ม เริ่ม ยกเลิก ตั้งค่า บันทึกสถานที่"],
          ["แถบทางเลี้ยว", "บน ขณะนำทาง", "ลูกศร ระยะถึงทางเลี้ยวถัดไป และคำแนะนำ"],
          ["ตัวอย่าง HUD", "บนขวา", "หน้าตาการ์ดที่จะขึ้นบน HUD (ซ่อนได้ในตั้งค่า)"],
          ["+ / −", "ล่างขวา", "ซูม"],
          ["หน้าต่างลอย", "มุมขวาล่าง", "ย้ายแผนที่ไปเป็นหน้าต่างลอย แล้วปิดหน้านี้"]] } },
      { h: "เลือกที่หมายได้ 5 แบบ", img: "nav-search", cap: "ผลค้นหา Siam Paragon",
        ol: [
          "ค้นหา: ผลจาก TomTom ไม่เกิน 6 รายการพร้อมที่อยู่ ใช้ได้ทั้งไทยและอังกฤษ ที่ใกล้รถขึ้นก่อน",
          "แตะค้างบนแผนที่: ได้หมุดที่ปักไว้และเส้นทางทันที เหมาะกับที่ที่ไม่มีชื่อ เช่น ประตูหลังหมู่บ้าน",
          "สถานที่ที่บันทึกไว้: แตะช่องค้นหาตอนว่าง บันทึกที่หมายปัจจุบันด้วย บันทึกสถานที่ ในการ์ดเส้นทาง",
          "ส่งจาก iPhone: ใน Google Maps หรือ Apple Maps กด แชร์ → Send to 7xDash หน้านำทางจะเปิดพร้อมสถานที่อยู่บนสุดของรายการล่าสุด แตะเพื่อดูเส้นทาง ทริปที่กำลังนำทางจะไม่ถูกเปลี่ยน",
          "ส่งจาก 7xDash web: ในหน้า ดูรถจากระยะไกล วางลิงก์ Google Maps / Apple Maps พิกัด หรือพิมพ์ชื่อ ใช้ได้กับผู้โดยสารที่ไม่มี iPhone"] },
      { h: "ดูเส้นทางก่อนออก", img: "nav-preview", cap: "3 เส้นทางให้เลือก เส้นแนะนำถูกเลือกไว้ กด เริ่ม เพื่อออก",
        list: [
          "TomTom ให้สูงสุด 3 เส้น เส้น แนะนำ ดีที่สุดตามจราจรตอนนั้น แตะการ์ดหรือเส้นสีเทาบนแผนที่เพื่อเลือกเส้นอื่น",
          "เวลาคำนวณรวมจราจรสด",
          "การ์ดแสดงเวลา · ระยะ · เวลาถึง และแบตที่จะเหลือเมื่อถึง",
          "กด เริ่ม หรือ ยกเลิก ถ้าหาเส้นทางไม่ได้จะมีปุ่ม ลองอีกครั้ง"] },
      { h: "ขณะนำทาง", img: "nav-guiding", cap: "แผนที่ 3 มิติตามรถ เวลา ระยะ เวลาถึง และแบตอยู่ล่างซ้าย × คือจบทริป",
        list: [
          "แถบทางเลี้ยวแสดงลูกศร ระยะถึงทางเลี้ยวถัดไป (300 ม.) และคำแนะนำ (เลี้ยวขวาเข้า ถ.พระรามที่ 1) บรรทัดที่สองบอกเพิ่ม เช่น ทางด่วน หรือ ที่หมายอยู่ทางซ้าย",
          "แผนที่ 3 มิติหันตามรถ ลากออกไปแล้วกด กลับไปที่รถ เพื่อกลับมาตาม ปุ่ม + / − จำไว้ใช้ทริปหน้า",
          "ออกนอกเส้นทางเกิน 45 ม. ติดกัน 3 ครั้ง จะขึ้น กำลังหาเส้นทางใหม่… แล้วหาเส้นทางจากจุดที่อยู่ ไม่ถี่กว่า 10 วินาทีครั้ง (GPS ในลานจอดมักแกว่ง)",
          "ทุก 10 นาทีจะขอเส้นทางใหม่จาก TomTom เพื่ออัปเดตจราจรและเวลาถึง",
          "ปิดหน้าจอได้ การนำทางทำต่อบน HUD แผนที่ลอย และหน้าปัดลอย แถบแจ้งเตือนจะบอกว่ากำลังนำทางจนกว่าจะถึงหรือกด สิ้นสุด",
          "เข้าใกล้ที่หมายไม่เกิน 30 ม. จะขึ้น ถึงแล้ว 15 วินาที แล้วจบเอง"] },
      { h: "แบตเตอรี่เมื่อถึง", p: "คำนวณจากแบตและระยะวิ่งที่เหลือที่รถรายงาน เทียบกับระยะทางที่เหลือ อัปเดตไปตลอดทาง",
        rows: { cols: ["แสดง", "ความหมาย", "สี"], rows: [
          ["แบตเหลือ 64% เมื่อถึง", "พอ", "ปกติ"], ["แบตเหลือ 12% เมื่อถึง", "ต่ำกว่า 15%", "ส้ม"],
          ["ขาดอีก 40 กม.: แวะชาร์จระหว่างทาง", "ไปไม่ถึง", "แดง"], ["แบตเมื่อถึง: กำลังรอข้อมูลจากรถ", "รถยังไม่ส่งค่ามา", "ปกติ"]] },
        p2: "แสดงในการ์ดเส้นทาง บน HUD (ถึง 14:35 · 64%) เป็นชิปบนแผนที่ลอย และบนหน้าปัดลอย" },
      { h: "แผนที่ลอย", img: "nav-float-window", cap: "แผนที่ลอยทางขวา หน้าหลักหรือแอปอื่นทางซ้ายใช้ต่อได้",
        list: [
          "เปิดด้วยปุ่ม หน้าต่างลอย ในหน้านำทาง หรือปุ่มลัด เปิด/ปิดแผนที่ลอย (พวงมาลัย แผงปุ่มลัด หรือระบบอัตโนมัติ) ครั้งแรกต้องอนุญาต แสดงทับแอปอื่น",
          "ซ้ายบน: ทางเลี้ยวถัดไปและระยะ ขวาบน: ถึง 09:58 น. และบรรทัดล่างเป็นเวลาและระยะที่เหลือ (14 นาที · 3.4 กม.)",
          "ชิปแบตบอกแบตเมื่อถึงตามสี",
          "⚙ เปิดตั้งค่าการนำทางข้างหน้าต่าง ⛶ กลับไปหน้าเต็มจอ ✕ ปิดหน้าต่าง การนำทางยังทำต่อบน HUD",

 port (where Sentry Mode saves its recordings) stays powered after you leave the car, so recording can continue. If the storage location is a drive on the Type-C port, that port loses power and recording switches to the drive on the USB-A port.", "th": "เมื่อเปิดโหมดเฝ้ารถ หลังคุณออกจากรถจะมีไฟเลี้ยงเฉพาะพอร์ต USB-A (ที่โหมดเฝ้ารถบันทึกไฟล์) การบันทึกจึงทำต่อได้ ถ้าตำแหน่งจัดเก็บเป็นไดรฟ์บนพอร์ต Type-C พอร์ตนั้นจะไม่มีไฟและการบันทึกจะย้ายไปที่ไดรฟ์บนพอร์ต USB-A"}}, {"type": "SwitchPreferenceCompat", "key": "pref_relay_write", "title": {"en": "Relay write", "th": "เขียนผ่านพื้นที่พัก"}, "summary": {"en": "Writes to internal storage first, then moves each finished clip to the USB drive, reducing dropped frames on a slow drive. When on, recording doesn't switch to another USB drive if this one disconnects.", "th": "เขียนลงหน่วยความจำภายในก่อน แล้วย้ายคลิปที่เสร็จแล้วไปยังไดรฟ์ USB ช่วยลดเฟรมตกบนไดรฟ์ที่ช้า เมื่อเปิด การบันทึกจะไม่ย้ายไปไดรฟ์ USB อื่นถ้าไดรฟ์นี้หลุด"}}, {"type": "EditTextPreference", "key": "pref_video_limit", "title": {"en": "Video storage cap", "th": "เพดานพื้นที่วิดีโอ"}, "summary": {"en": "How much of the USB drive videos may use, in GB. When it is full, the oldest clips are deleted first.", "th": "พื้นที่ในแฟลชไดรฟ์ที่ให้วิดีโอใช้ได้ (GB) ถ้าเต็มจะลบคลิปเก่าสุดก่อน"}}, {"type": "EditTextPreference", "key": "pref_photo_limit", "title": {"en": "Photo storage cap", "th": "เพดานพื้นที่ภาพถ่าย"}, "summary": {"en": "How much of the USB drive photos may use, in GB. When it is full, the oldest photos are deleted first.", "th": "พื้นที่ในแฟลชไดรฟ์ที่ให้รูปใช้ได้ (GB) ถ้าเต็มจะลบรูปเก่าสุดก่อน"}}, {"type": "SwitchPreferenceCompat", "key": "pref_footage_lock", "title": {"en": "Lock footage", "th": "ล็อกไฟล์บันทึก"}, "summary": {"en": "Lock videos and photos in playback. Locked files are never removed by automatic cleanup and can't be deleted until unlocked; if locked files fill the space, recording stops", "th": "ล็อกวิดีโอและภาพถ่ายในหน้าเล่นซ้ำ ไฟล์ที่ล็อกจะไม่ถูกลบโดยการล้างอัตโนมัติ และลบไม่ได้จนกว่าจะปลดล็อก ถ้าไฟล์ที่ล็อกเต็มพื้นที่ การบันทึกจะหยุด"}}, {"type": "SwitchPreferenceCompat", "key": "pref_footage_lock_flash", "title": {"en": "Flash-to-pass triggers Instant capture", "th": "กะพริบไฟสูงเพื่อเก็บคลิปทันที"}, "summary": {"en": "While recording, flashing the high beam does the same as Instant capture: the surround view from 10 seconds before to 10 seconds after is saved to Saved captures, and those clips are locked on every camera. If locked footage fills the space, recording stops.", "th": "ขณะบันทึก การกะพริบไฟสูงทำงานเหมือนการเก็บคลิปทันที: บันทึกภาพรอบคันตั้งแต่ 10 วินาทีก่อนถึง 10 วินาทีหลังไว้ในคลิปที่เก็บไว้ และล็อกคลิปช่วงนั้นของทุกกล้อง ถ้าไฟล์ที่ล็อกเต็มพื้นที่ การบันทึกจะหยุด"}}, {"type": "Preference", "key": "pref_instant_captures", "title": {"en": "Saved captures", "th": "คลิปที่เก็บไว้"}, "summary": {"en": "Watch or delete the clips saved by Instant capture (from a tap, a shortcut or flash-to-pass)", "th": "ดูหรือลบคลิปที่บันทึกด้วยการเก็บคลิปทันที (จากการแตะ ปุ่มลัด หรือการกะพริบไฟสูง)"}}, {"type": "SwitchPreferenceCompat", "key": "pref_footage_lock_horn", "title": {"en": "Lock footage on horn", "th": "ล็อกไฟล์เมื่อบีบแตร"}, "summary": {"en": "The head unit can't read the horn signal yet, so this is unavailable", "th": "หัวเครื่องยังอ่านสัญญาณแตรไม่ได้ จึงยังใช้ไม่ได้"}}, {"type": "Preference", "key": "pref_footage_locked", "title": {"en": "Locked", "th": "ล็อกอยู่"}, "summary": {"en": "How much space locked clips use (instant captures and saved moments). Locked clips are never deleted to make room.", "th": "พื้นที่ที่คลิปล็อกไว้ใช้อยู่ (จับภาพทันทีและช่วงเวลาที่บันทึก) คลิปพวกนี้จะไม่ถูกลบเพื่อเคลียร์ที่"}}, {"type": "Preference", "key": "pref_storage_usage", "title": {"en": "Video folder", "th": "โฟลเดอร์วิดีโอ"}, "summary": {"en": "Where videos are saved, and how much space they use now.", "th": "ที่เก็บวิดีโอ และพื้นที่ที่ใช้อยู่ตอนนี้"}}]}], "img": "storage", "hidden": false}, {"key": "sc th": "กระจกข้าง"}, "summary": null, "groups": [{"title": null, "items": [{"type": "SwitchPreferenceCompat", "key": "pref_side_popup", "title": {"en": "Turn-signal side view", "th": "ภาพด้านข้างเมื่อเปิดไฟเลี้ยว"}, "summary": {"en": "While you signal, a pop-up shows the camera on that side: left signal, left camera. It closes when the signal goes off. No pop-up in reverse. Not shown while the Super mirror is on", "th": "ขณะเปิดไฟเลี้ยว ป๊อปอัปจะแสดงกล้องด้านนั้น: เลี้ยวซ้าย กล้องซ้าย และปิดเมื่อไฟเลี้ยวดับ ไม่แสดงขณะถอย ไม่แสดงขณะเปิดกระจกมองหลังอัจฉริยะ"}}]}, {"title": {"en": "Where it shows", "th": "แสดงที่ไหน"}, "items": [{"type": "SwitchPreferenceCompat", "key": "pref_side_popup_screen", "title": {"en": "On the centre screen", "th": "บนหน้าจอกลาง"}, "summary": {"en": "Shows that side camera on the centre screen. Turn on with On the driver HUD to show it on both", "th": "แสดงกล้องด้านนั้นบนหน้าจอกลาง เปิดคู่กับ \"บน HUD ของผู้ขับ\" เพื่อให้ขึ้นทั้งสองที่"}}, {"type": "SwitchPreferenceCompat", "key": "pref_side_popup_hud", "title": {"en": "On the driver HUD", "th": "บน HUD ของผู้ขับ"}, "summary": {"en": "Shows that side camera on the windscreen as a small picture, so the car's own speed and lane graphics stay. If this car has no HUD display, it shows on the centre screen instead", "th": "แสดงกล้องด้านนั้นบนกระจกหน้าเป็นภาพเล็ก ข้อมูลความเร็วและเลนของรถจึงยังอยู่ ถ้ารถคันนี้ไม่มี HUD จะแสดงที่หน้าจอกลางแทน"}}, {"type": "SegmentedPreference", "key": "pref_side_popup_style", "title": {"en": "Pop-up style", "th": "รูปแบบป๊อปอัป"}, "summary": {"en": "On the centre screen. Wide is a landscape picture with rounded corners in the top-right corner for both sides, like Tesla's blind-spot camera", "th": "บนจอกลาง แบบกว้างเป็นภาพแนวนอนมุมโค้ง ขึ้นที่มุมขวาบนทั้งสองฝั่ง คล้ายกล้องจุดบอดของ Tesla"}}, {"type": "SeekBarPreference", "key": "pref_side_popup_size", "title": {"en": "Pop-up size (% of screen height)", "th": "ขนาดป๊อปอัป (% ของความสูงจอ)"}, "summary": {"en": "Up to half the screen width. The right side opens at the right edge, the left side near the middle", "th": "ได้สูงสุดครึ่งความกว้างจอ ฝั่งขวาขึ้นชิดขอบขวา ฝั่งซ้ายขึ้นแถวกลางจอ"}}, {"type": "SeekBarPreference", "key": "pref_side_popup_vertical", "title": {"en": "Height on screen (%)", "th": "ความสูงบนจอ (%)"}, "summary": {"en": "0 is the top, 100 the bottom", "th": "0 คือด้านบน 100 คือด้านล่าง"}}, {"type": "SeekBarPreference", "key": "pref_side_popup_hud_width", "title": {"en": "HUD width (%)", "th": "ความกว้างบน HUD (%)"}, "summary": {"en": "How wide the picture is on the windscreen. It stays on the outer edge, clear of the car graphic. 27 is about 16:9 on this car", "th": "ความกว้างของภาพบนกระจกหน้า ภาพอยู่ชิดขอบด้านนอก ไม่บังกราฟิกรถ 27 ประมาณ 16:9 บนรถคันนี้"}}, {"type": "SeekBarPreference", "key": "pref_side_popup_hud_height", "title": {"en": "HUD height (%)", "th": "ความสูงบน HUD (%)"}, "summary": {"en": "How tall the picture is on the windscreen. 45 matches the last build. 100 fills the strip", "th": "ความสูงของภาพบนกระจกหน้า 45 เท่ากับรุ่นก่อน 100 เต็มแถบ"}}, {"type": "SwitchPreferenceCompat", "key": "pref_side_popup_hud_left", "title": {"en": "Both cameras on the left", "th": "กล้องทั้งสองอยู่ด้านซ้าย"}, "summary": {"en": "Left and right turn signals both put their picture on the left edge. Off keeps each camera on its own side", "th": "ไฟเลี้ยวซ้ายและขวาแสดงภาพที่ขอบซ้ายทั้งคู่ เมื่อปิด แต่ละกล้องอยู่ด้านของตัวเอง"}}, {"type": "SwitchPreferenceCompat", "key": "pref_both_mirrors_hud", "title": {"en": "Both side mirrors on the HUD", "th": "กระจกข้างทั้งสองบน HUD"}, "summary": {"en": "The both-mirrors shortcut puts the left picture on the left edge and the right picture on the right edge. Off keeps both on the centre screen", "th": "ปุ่มลัดกระจกข้างทั้งสองจะวางภาพซ้ายที่ขอบซ้ายและภาพขวาที่ขอบขวา เมื่อปิด ทั้งสองอยู่ที่หน้าจอกลาง"}}]}, {"title": {"en": "When it shows", "th": "แสดงเมื่อไร"}, "items": [{"type": "SeekBarPreference", "key": "pref_side_popup_min_speed", "title": {"en": "Show from speed (km/h)", "th": "แสดงตั้งแต่ความเร็ว (กม./ชม.)"}, "summary": {"en": "Below this speed the car shows its own side view. 0 shows it at any speed", "th": "ต่ำกว่าความเร็วนี้ รถจะแสดงภาพด้านข้างของตัวเอง 0 คือแสดงทุกความเร็ว"}}, {"type": "SwitchPreferenceCompat", "key": "pref_side_popup_warning", "title": {"en": "Show the side when the car warns", "th": "แสดงภาพด้านข้างเมื่อรถเตือน"}, "summary": {"en": "When the car lights the warning lamp in a mirror (or warns of cross traffic), that side's camera opens and the edge of the picture on that side blinks red, like Tesla, even without the turn signal, from the speed below. With your turn signal on towards a warned side it shows at any speed. The turn signal still wins. Never in R.", "th": "เมื่อไฟเตือนที่กระจกมองข้างติด (หรือมีเตือนรถตัดผ่าน) ภาพกล้องด้านนั้นจะขึ้นเอง และขอบภาพฝั่งนั้นจะกะพริบสีแดงแบบ Tesla แม้ไม่ได้เปิดไฟเลี้ยว ตั้งแต่ความเร็วด้านล่าง ถ้าเปิดไฟเลี้ยวไปทางฝั่งที่มีเตือนจะแสดงทุกความเร็ว ถ้าเปิดไฟเลี้ยวจะยึดตามไฟเลี้ยว ไม่ทำงานในเกียร์ R"}}, {"type": "SeekBarPreference", "key": "pref_side_popup_warning_min_speed", "title": {"en": "Warning shows from speed (km/h)", "th": "เตือนตั้งแต่ความเร็ว (กม./ชม.)"}, "summary": {"en": "Below this the car's warning alone does not open the side or blink the lights, so city traffic does not keep warning. Signalling towards a warned side always does. 0 = any speed", "th": "ต่ำกว่านี้ การเตือนอย่างเดียวจะไม่เปิดภาพด้านข้างและไม่กะพริบไฟ เพื่อไม่ให้เตือนบ่อยในเมือง ถ้าเปิดไฟเลี้ยวไปทางฝั่งที่มีเตือนจะแสดงเสมอ 0 = ทุกความเร็ว"}}, {"type": "SwitchPreferenceCompat", "key": "pref_side_popup_door", "title": {"en": "Show the side when a door opens", "th": "แสดงด้านข้างเมื่อเปิดประตู"}, "summary": {"en": "While stopped, opening a door shows the camera on that side, so you can see cars and bikes coming from behind. It closes when the doors close", "th": "ขณะรถจอด เมื่อเปิดประตูจะแสดงกล้องฝั่งนั้น เพื่อดูรถหรือจักรยานที่มาจากด้านหลัง และปิดเมื่อประตูปิดหมด"}}, {"type": "SwitchPreferenceCompat", "key": "pref_side_popup_over_factory", "title": {"en": "Show over the car's own view", "th": "แสดงทับภาพของรถ"}, "summary": {"en": "Opens even while the car shows its 360 view, its own side view or park assist. Never in R", "th": "ขึ้นได้แม้รถกำลังแสดงภาพ 360 ภาพด้านข้างของรถเอง หรือระบบช่วยจอด ยกเว้นตอนเข้าเกียร์ R"}}, {"type": "SwitchPreferenceCompat", "key": "pref_side_popup_instant", "title": {"en": "Instant pop-up", "th": "ป๊อปอัปทันใจ"}, "summary": {"en": "In D, keeps the side view ready in the background so the picture is there as soon as you signal. The camera stays on while driving, which uses a little more power", "th": "ในเกียร์ D จะเตรียมภาพด้านข้างไว้เบื้องหลัง ภาพจึงขึ้นทันทีที่เปิดไฟเลี้ยว กล้องเปิดค้างขณะขับ ใช้พลังงานมากขึ้นเล็กน้อย"}}, {"type": "SeekBarPreference", "key": "pref_side_popup_close_delay_ms", "title": {"en": "Stay open after the signal (ms)", "th": "เปิดค้างหลังไฟเลี้ยวดับ (มิลลิวินาที)"}, "summary": {"en": "1000 ms = 1 second. 0 closes it as soon as the signal goes off. Reversing still closes it straight away, and so does the car's own view when Show over the car's own view is off", "th": "1000 มิลลิวินาที = 1 วินาที 0 คือปิดทันทีที่ไฟเลี้ยวดับ เข้าเกียร์ถอยยังปิดป๊อปอัปทันที และภาพของรถก็ปิดทันทีถ้าปิด \"แสดงทับภาพของรถ\" ไว้"}}]}, {"title": {"en": "Picture", "th": "ภาพ"}, "items": [{"type": "SwitchPreferenceCompat", "key": "pref_side_popup_straighten", "title": {"en": "Straighten picture", "th": "ปรับภาพให้ตรง"}, "summary": {"en": "Corrects the fisheye curve before showing it; the three settings below set how wide it looks and where it points. Only changes the pop-up; recordings are not affected", "th": "แก้ความโค้งของเลนส์ตาปลาก่อนแสดง สามค่าด้านล่างกำหนดความกว้างและทิศทางของภาพ เปลี่ยนเฉพาะป๊อปอัป ไม่มีผลกับไฟล์บันทึก"}}, {"type": "SeekBarPreference", "key": "pref_side_popup_fov", "title": {"en": "View width (°)", "th": "ความกว้างภาพ (°)"}, "summary": {"en": "Smaller zooms in. Only applies with Straighten picture on", "th": "ค่าน้อยลงคือซูมเข้า ใช้ได้เฉพาะเมื่อเปิดปรับภาพให้ตรง"}}, {"type": "SeekBarPreference", "key": "pref_side_popup_yaw", "title": {"en": "Aim back (°)", "th": "หันไปด้านหลัง (°)"}, "summary": {"en": "Positive turns the view towards the rear (the blind spot), negative towards the front. The direction is a guess: if it turns the wrong way, drag the other way", "th": "ค่าบวกหันภาพไปทางด้านหลัง (จุดบอด) ค่าลบหันไปด้านหน้า ทิศทางเป็นการคาดเดา ถ้าหันผิดทาง ให้ลากไปอีกทาง"}}, {"type": "SeekBarPreference", "key": "pref_side_popup_pitch", "title": {"en": "Aim up (°)", "th": "เงยขึ้น (°)"}, "summary": {"en": "Positive turns the view out towards the road further away, negative down at the car and the ground. The direction is a guess: if it turns the wrong way, drag the other way", "th": "ค่าบวกเงยภาพออกไปทางถนนที่ไกลขึ้น ค่าลบก้มลงหาตัวรถและพื้น ทิศทางเป็นการคาดเดา ถ้าหันผิดทาง ให้ลากไปอีกทาง"}}, {"type": "SeekBarPreference", "key": "pref_side_popup_roll_left", "title": {"en": "Rotate left (°)", "th": "หมุนภาพซ้าย (°)"}, "summary": {"en": "Positive turns the picture clockwise to level a tilted horizon. Left and right are separate. If it turns the wrong way, drag the other way", "th": "ค่าบวกหมุนภาพตามเข็มนาฬิกาเพื่อปรับเส้นขอบฟ้าที่เอียง ซ้ายและขวาตั้งแยกกัน ถ้าหมุนผิดทาง ให้ลากไปอีกทาง"}}, {"type": "SeekBarPreference", "key": "pref_side_popup_roll_right", "title": {"en": "Rotate right (°)", "th": "หมุนภาพขวา (°)"}, "summary": {"en": "Positive turns the picture clockwise to level a tilted horizon. Left and right are separate. If it turns the wrong way, drag the other way", "th": "ค่าบวกหมุนภาพตามเข็มนาฬิกาเพื่อปรับเส้นขอบฟ้าที่เอียง ซ้ายและขวาตั้งแยกกัน ถ้าหมุนผิดทาง ให้ลากไปอีกทาง"}}]}, {"title": {"en": "Blind spot", "th": "จุดบอด"}, "items": [{"type": "Preference", "key": "pref_side_popup_bsd_test", "title": {"en": "Show a test warning", "th": "ลองแสดงการเตือน"}, "summary": {"en": "Pretends the car warns of a car on the left for 4 seconds: the left side view opens and its left edge blinks red. Works parked.", "th": "จำลองว่ารถเตือนว่ามีรถอยู่ด้านซ้าย 4 วินาที ภาพด้านซ้ายจะขึ้นและขอบซ้ายจะกะพริบสีแดง ใช้ได้ตอนจอด"}}, {"type": "Preference", "key": "pref_side_popup_bsd_finder", "title": {"en": "Blind-spot warning finder", "th": "ค้นหาสัญญาณเตือนจุดบอด"}, "summary": {"en": "Teach 7xDash which car signal means a car is in your blind spot. Then the side view gets a red edge and the mood lights turn red while it warns", "th": "สอน 7xDash ว่าสัญญาณไหนของรถบอกว่ามีรถอยู่ในจุดบอด จากนั้นภาพด้านข้างจะมีขอบแดง และไฟบรรยากาศจะเป็นสีแดงขณะเตือน"}}, {"type": "SwitchPreferenceCompat", "key": "pref_side_popup_bsd_sniffer", "title": {"en": "Report blind-spot signals (experimental)", "th": "แจ้งสัญญาณจุดบอด (ทดลอง)"}, "summary": {"en": "While the screen is on, watches every car setting that looks blind-spot related. Each change is written to the log and black box and shown on the HUD as \"BSD?\" with its name and value, so you notice when the car sends something as a car passes. Each time it also writes a log file: every car setting with its value at the start, then each change with the time, gear, speed and turn signal. Then teach it in the Blind-spot warning finder", "th": "ขณะหน้าจอเปิด จะเฝ้าดูการตั้งค่ารถทุกอย่างที่ดูเกี่ยวกับจุดบอด ทุกครั้งที่ค่าเปลี่ยนจะบันทึกลงล็อกและกล่องดำ และแสดงบน HUD เป็น \"BSD?\" พร้อมชื่อและค่า ให้รู้ว่ารถส่งสัญญาณอะไรตอนมีรถผ่าน ทุกครั้งยังเขียนไฟล์ล็อกด้วย: ตอนเริ่มจดการตั้งค่ารถทุกอย่างพร้อมค่า แล้วจดทุกครั้งที่ค่าเปลี่ยนพร้อมเวลา เกียร์ ความเร็ว และไฟเลี้ยว จากนั้นสอนได้ในหน้าค้นหาสัญญาณเตือนจุดบอด"}}, {"type": "Preference", "key": "pref_side_popup_bsd_log_send", "title": {"en": "Send blind-spot log to phone", "th": "ส่งล็อกจุดบอดเข้ามือถือ"}, "summary": {"en": "The newest log from Report blind-spot signals, as a text file over Wi-Fi with a QR code. Turn the report on, drive with cars passing on both sides, then send it.", "th": "ส่งไฟล์ล็อกล่าสุดจาก แจ้งสัญญาณจุดบอด เป็นไฟล์ข้อความผ่าน Wi-Fi ด้วย QR เปิดการแจ้งไว้ ขับให้มีรถผ่านทั้งสองฝั่ง แล้วค่อยส่ง"}}]}], "img": "side_mirror", "hidden": false}, {"key": "screen_floating", "title": {"en": "Floating windows", "th": "หน้าต่างลอย"}, "summary": null, "groups": [{"title": null, "items": [{"type": "SwitchPreferenceCompat", "key": "pref_dash_panel", "title": {"en": "Dash panel", "th": "หน้าปัดลอย"}, "summary": {"en": "A small card that floats over maps, music or any other app: speed, gear, turn signals, the clock and whether 7xDash is recording, with buttons for a surround photo, an instant capture, Super mirror and opening 7xDash. On its right: minimize (to a small pill with speed and gear, these buttons in a row under it, or beside it when the Macro pad is on; tap the pill or expand to bring the panel back), record, dim (tap on or off, slide for how dark) and quit (tap twice). Drag to move, pinch to resize, push to a side to dock", "th": "การ์ดเล็กที่ลอยเหนือแผนที่ เพลง หรือแอปอื่น: ความเร็ว เกียร์ ไฟเลี้ยว นาฬิกา และสถานะการบันทึกของ 7xDash พร้อมปุ่มถ่ายรูปรอบคัน บันทึกคลิปทันที กระจกมองหลัง และเปิด 7xDash ด้านขวามีปุ่มย่อ (เหลือแถบเล็กแสดงความเร็วและเกียร์ พร้อมปุ่มด้านขวาเรียงใต้แถบ หรือข้างแถบเมื่อเปิดแผงปุ่มลัด แตะแถบหรือปุ่มขยายเพื่อขยายกลับ) ปุ่มบันทึก ปุ่มหรี่จอ (แตะเพื่อเปิดหรือปิด เลื่อนเพื่อปรับความมืด) และปุ่มปิดแอป (แตะสองครั้ง) ลากเพื่อย้าย บีบเพื่อปรับขนาด ดันไปขอบเพื่อเก็บ"}}, {"type": "SwitchPreferenceCompat", "key": "pref_macro_pad", "title": {"en": "Macro pad", "th": "แผงปุ่มลัด"}, "summary": {"en": "A floating pad of six buttons over any app. Choose what each one does on the Macro pad card. With the Dash panel up, it hangs right under the panel and moves with it", "th": "แผงปุ่มลอย 6 ปุ่มทับทุกแอป เลือกได้ว่าแต่ละปุ่มทำอะไรที่การ์ดแผงปุ่มลัด เมื่อเปิด Dash panel อยู่ แผงปุ่มจะติดอยู่ใต้ panel และเลื่อนตามไปด้วย"}}, {"type": "Preference", "key": "pref_reset_floating", "title": {"en": "Reset Dash panel", "th": "รีเซ็ตหน้าปัดลอย"}, "summary": {"en": "Puts the Dash panel back to its default size and place", "th": "คืนขนาดและตำแหน่งของหน้าปัดลอยเป็นค่าเริ่มต้น"}}]}], "img": "floating", "hidden": false}, {"key": "screen_dim", "title": {"en": "Dim overlay", "th": "หรี่หน้าจอ"}, "summary": null, "groups": [{"title": null, "items": [{"type": "SwitchPreferenceCompat", "key": "pref_dim", "title": {"en": "Dim overlay", "th": "หรี่หน้าจอ"}, "summary": {"en": "Covers the whole screen so maps is less bright. Default opacity 90%. Touches still reach the app underneath", "th": "คลุมทั้งหน้าจอเพื่อให้แผนที่สว่างน้อยลง ความทึบเริ่มต้น 90% การแตะยังส่งถึงแอปด้านล่าง"}}, {"type": "SeekBarPreference", "key": "pref_dim_opacity", "title": {"en": "Opacity", "th": "ความทึบ"}, "summary": {"en": "How dark the dim veil is.", "th": "ความมืดของม่านหรี่จอ"}}, {"type": "SeekBarPreference", "key": "pref_dim_brightness", "title": {"en": "Brightness", "th": "ความสว่าง"}, "summary": {"en": "0 is pure black. Higher is a lighter veil", "th": "0 คือดำสนิท ค่าสูงขึ้นคือม่านที่จางลง"}}, {"type": "SeekBarPreference", "key": "pref_dim_warmth", "title": {"en": "Warmth", "th": "ความอุ่นของสี"}, "summary": {"en": "Higher shifts the veil toward amber", "th": "ค่าสูงขึ้นทำให้ม่านออกโทนสีเหลืองอำพัน"}}, {"type": "SwitchPreferenceCompat", "key": "pref_dim_passthrough", "title": {"en": "Pass touches through", "th": "ให้การแตะทะลุผ่าน"}, "summary": {"en": "On: maps still receives taps. Off: the veil blocks them", "th": "เปิด: แผนที่ยังรับการแตะได้ ปิด: ม่านจะกั้นการแตะไว้"}}, {"type": "Preference", "key": "pref_dim_reset", "title": {"en": "Reset", "th": "รีเซ็ต"}, "summary": {"en": "Opacity 90%, brightness 0, warmth 0, touches pass through", "th": "ความทึบ 90%, ความสว่าง 0, ความอุ่น 0, การแตะทะลุผ่าน"}}, {"type": "SwitchPreferenceCompat", "key": "pref_auto_dim", "title": {"en": "Auto dim by time (experimental)", "th": "หรี่อัตโนมัติตามเวลา (ทดลอง)"}, "summary": {"en": "Turns dim on and off by the clock. Probes system brightness once into diagnostics; most head units cannot read it", "th": "เปิดและปิดการหรี่ตามนาฬิกา ตรวจความสว่างของระบบหนึ่งครั้งเก็บไว้ในข้อมูลวินิจฉัย หัวเครื่องส่วนใหญ่อ่านค่านี้ไม่ได้"}}, {"type": "SeekBarPreference", "key": "pref_auto_dim_start", "title": {"en": "Dim from", "th": "หรี่ตั้งแต่"}, "summary": {"en": "Hour when dim turns on", "th": "ชั่วโมงที่เริ่มหรี่"}}, {"type": "SeekBarPreference", "key": "pref_auto_dim_end", "title": {"en": "Dim until", "th": "หรี่จนถึง"}, "summary": {"en": "Hour when dim turns off", "th": "ชั่วโมงที่เลิกหรี่"}}]}], "img": "dim", "hidden": false}, {"key": "screen_interface", "title": {"en": "Interface", "th": "อินเทอร์เฟซ"}, "summary": null, "groups": [{"title": null, "items": [{"type": "ListPreference", "key": "pref_language", "title": {"en": "Language", "th": "ภาษา"}, "summary": {"en": "%s", "th": "%s"}}, {"type": "SegmentedPreference", "key": "pref_menu_side", "title": {"en": "Side menu", "th": "เมนูด้านข้าง"}, "summary": {"en": "Where the home control bar, the slide-out menu and the settings list sit", "th": "ตำแหน่งของแถบควบคุมหน้าหลัก เมนูเลื่อน และรายการการตั้งค่า"}}, {"type": "SegmentedPreference", "key": "pref_rail_side", "title": {"en": "Action button side", "th": "ด้านของปุ่มการทำงาน"}, "summary": {"en": "Put them on the driver's side", "th": "วางไว้ฝั่งผู้ขับ"}}, {"type": "SwitchPreferenceCompat", "key": "pref_beta_features", "title": {"en": "Beta features", "th": "ฟีเจอร์เบต้า"}, "summary": {"en": "Show features that are still being tried on the car, and let them run. Now: Where I parked (home card, and reading the signs when the car goes into P) Battery at arrival and OBD2. The Where I parked shortcut still works.", "th": "แสดงและเปิดใช้ฟีเจอร์ที่ยังทดลองในรถอยู่ ตอนนี้มี: จอดไว้ที่ไหน (การ์ดในหน้าหลัก และอ่านป้ายเมื่อเข้าเกียร์ P) แบตเมื่อถึงที่หมาย และ OBD2 ปุ่มลัดจอดไว้ที่ไหนยังใช้ได้"}}, {"type": "SwitchPreferenceCompat", "key": "pref_crash_reports", "title": {"en": "Anonymous crash reports", "th": "รายงานข้อผิดพลาด (ไม่ระบุตัวตน)"}, "summary": {"en": "When 7xDash crashes, the next start sends the kind of error and where in 7xDash's code it happened. Never the error's message, files or anything on screen", "th": "ถ้าแอปหยุดทำงานกะทันหัน ครั้งหน้าที่เปิดแอปจะส่งประเภทของข้อผิดพลาดและจุดที่เกิดในโค้ด ไม่ส่งรายละเอียดข้อความ ไฟล์ หรือสิ่งที่อยู่บนหน้าจอ"}}, {"type": "SwitchPreferenceCompat", "key": "pref_usage_stats", "title": {"en": "Anonymous usage stats", "th": "สถิติการใช้งาน (ไม่ระบุตัวตน)"}, "summary": {"en": "Which features get used: app start, home cards, pages, actions and what ran them, buttons you set up, recording, 7xDash web controls. A random install id only: no email, plate or location. About 20–50 KB a day", "th": "ฟีเจอร์ที่ใช้ เช่น การเปิดแอป การ์ดหน้าหลัก หน้าที่เปิด การทำงานที่ใช้และกดจากตรงไหน ปุ่มที่ตั้งค่าไว้ การบันทึก และการควบคุมจาก 7xDash เว็บ ใช้แค่รหัสสุ่มที่สร้างตอนติดตั้งแอป ไม่มีอีเมล ป้ายทะเบียน หรือตำแหน่ง ประมาณ 20–50 KB ต่อวัน"}}, {"type": "SwitchPreferenceCompat", "key": "pref_recording_stats", "title": {"en": "Recording status readout", "th": "แสดงสถานะการบันทึก"}, "summary": {"en": "Shows the elapsed time and current clip number in a corner while recording", "th": "แสดงเวลาที่ผ่านไปและหมายเลขคลิปปัจจุบันที่มุมจอขณะบันทึก"}}, {"type": "SwitchPreferenceCompat", "key": "pref_reduce_motion", "title": {"en": "Less motion while recording", "th": "ลดแอนิเมชันขณะบันทึก"}, "summary": {"en": "Turns off transitions and other decorative animation while recording, leaving the GPU to the encoder. The record button and progress ring still animate.", "th": "ปิดทรานสิชันและแอนิเมชันตกแต่งขณะบันทึก เพื่อให้ GPU ทำงานให้ตัวเข้ารหัส ปุ่มบันทึกและวงความคืบหน้ายังเคลื่อนไหวอยู่"}}, {"type": "SwitchPreferenceCompat", "key": "pref_vehicle_status", "title": {"en": "Vehicle status (experimental)", "th": "สถานะรถ (ทดลอง)"}, "summary": {"en": "Shows horn, flash-to-pass and hazard lights below Straighten on the main screen, using the Driving info bar icons; the horn signal can't be read yet", "th": "แสดงแตร การกะพริบไฟสูง และไฟฉุกเฉินใต้ ปรับให้ตรง บนหน้าจอหลัก โดยใช้ไอคอนแถบข้อมูลการขับขี่ ยังอ่านสัญญาณแตรไม่ได้"}}, {"type": "ListPreference", "key": "pref_fisheye_projection", "title": {"en": "Fisheye projection", "th": "การฉายภาพตาปลา"}, "summary": {"en": "How fisheye pictures are flattened when fisheye correction is on.", "th": "วิธีแก้ภาพโค้งจากเลนส์ตาปลา ตอนเปิดแก้ภาพตาปลา"}}, {"type": "SeekBarPreference", "key": "pref_fisheye_fov", "title": {"en": "Corrected field of view", "th": "มุมมองหลังแก้ภาพ"}, "summary": {"en": "A wider angle keeps more of the picture. Up to 140° for Straight lines, 180° for Wide and Full circle.", "th": "มุมกว้างขึ้นเก็บภาพได้มากขึ้น สูงสุด 140° สำหรับเส้นตรง 180° สำหรับกว้างและวงกลมเต็ม"}}]}], "img": "interface", "hidden": false}, {"key": "screen_system", "title": {"en": "System", "th": "ระบบ"}, "summary": null, "groups": [{"title": null, "items": [{"type": "SwitchPreferenceCompat", "key": "pref_auto_start", "title": {"en": "Start on boot", "th": "เริ่มเมื่อเปิดเครื่อง"}, "summary": {"en": "Keeps the app running in the background. After the head unit restarts or the system closes the app, restarts it and restores Super mirror, the Dash panel and auto-recording if they were on. When off, it isn't restarted.", "th": "ให้แอปทำงานอยู่เบื้องหลัง หลังหัวเครื่องรีสตาร์ทหรือระบบปิดแอป จะเปิดแอปใหม่และคืนค่ากระจกมองหลังอัจฉริยะ หน้าปัดลอย และการบันทึกอัตโนมัติถ้าเคยเปิดไว้ เมื่อปิด จะไม่เปิดแอปใหม่"}}, {"type": "SwitchPreferenceCompat", "key": "pref_screen_off_keep_recording", "title": {"en": "Keep recording when the screen goes off", "th": "บันทึกต่อเมื่อจอดับ"}, "summary": {"en": "Records only the surround view with the screen off; front and rear cabin recording resumes when the screen turns on. Without Sentry Mode, recording pauses while the head unit sleeps and resumes on wake. When off, recording stops once the screen turns off.", "th": "ขณะจอดับจะบันทึกเฉพาะภาพรอบคัน กล้องห้องโดยสารหน้าและหลังจะบันทึกต่อเมื่อจอเปิด ถ้าไม่มีโหมดเฝ้ารถ การบันทึกจะหยุดชั่วคราวขณะหัวเครื่องหลับ
