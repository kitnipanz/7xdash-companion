  screen_drive: ["Sign in to Google Drive for uploads.", "ล็อกอิน Google Drive สำหรับอัปโหลด"],
  screen_update: ["Updates, beta releases and What's new.", "อัปเดต รุ่นเบต้า และมีอะไรใหม่"]
};

const T = {
  en: {
    tag: "for the Zeekr 7X", h1: "What 7xDash does, and how to use it",
    lede: "Everything starts on this Home screen. Point at a feature to see where it is, then open it for the full how-to.",
    note: "7xDash is made by owners, not by Zeekr, and it is still being tested. It does not replace the car's own cameras or safety systems. Set things up while parked.",
    groups: { cards: "Home cards", rail: "Left rail", more: "Buttons and Settings" },
    beta: "beta", hint: "Tap a card on the screen, or pick a feature from the list.",
    start: [["Before you start", "Install the newest APK from GitHub Releases and plug in a USB drive. Clips, photos and your settings backup all go on it."],
            ["Tap or hold", "Tap a card to use it. Hold a card to open its settings. The rail on the left is there on every page."],
            ["Beta features", "Mood light, Where I parked, OBD2 and places from the iPhone only show after Settings → Interface → Beta features."]],
    all: "All features", tabFeatures: "Features", tabSettings: "Settings",
    setH1: "Every setting, explained", setLede: "Each page of Settings in 7xDash, with every switch, slider and choice and what it does. Open one to see it with its real screen.",
    allSettings: "All settings", settingsCount: n => n + " settings",
    kinds: { switch: "Switch", slider: "Slider", choice: "Choice", text: "Text field", button: "Opens / does" },
    hiddenNote: "Only shown after turning on developer mode.", choices: "Choices", realSettings: "This page in 7xDash",
    settingsWhere: "Settings", open: "How to open it", steps: "How to use it", options: "What you can change", notes: "Good to know",
    prev: "Previous", next: "Next", deep: "In depth", when: "When", doit: "Do", homeShot: "Where it is on the Home screen", realShot: "The real screen in 7xDash",
    foot: "7xDash 1.8.27 · open source, GPL-3.0 · screenshots from the head unit emulator · if something does not work, Settings → System → Diagnostics makes a report to send."
  },
  th: {
    tag: "สำหรับ ZEEKR 7X", h1: "7xDash ทำอะไรได้บ้าง และใช้ยังไง",
    lede: "ทุกอย่างเริ่มจากหน้าหลักนี้ ชี้ที่ฟีเจอร์เพื่อดูว่าอยู่ตรงไหน แล้วกดเข้าไปดูวิธีใช้แบบละเอียด",
    note: "7xDash เป็นแอปที่เจ้าของรถทำกันเอง ไม่ใช่ของ ZEEKR และยังอยู่ระหว่างทดสอบ ใช้แทนกล้องหรือระบบความปลอดภัยของรถไม่ได้ ควรตั้งค่าตอนจอดรถ",
    groups: { cards: "การ์ดบนหน้าหลัก", rail: "แถบด้านซ้าย", more: "ปุ่มลัด และในหน้าตั้งค่า" },
    beta: "เบต้า", hint: "แตะการ์ดบนรูปจอ หรือเลือกฟีเจอร์จากรายการ",
    start: [["ก่อนเริ่ม", "ลง APK ตัวล่าสุดจาก GitHub แล้วเสียบแฟลชไดรฟ์ทิ้งไว้ คลิป รูป และไฟล์สำรองการตั้งค่าจะเก็บลงแฟลชไดรฟ์ทั้งหมด"],
            ["แตะ กับ กดค้าง", "แตะการ์ดเพื่อใช้งาน กดค้างเพื่อเข้าไปตั้งค่าฟีเจอร์นั้น แถบซ้ายมีให้กดได้ทุกหน้า"],
            ["ฟีเจอร์เบต้า", "ไฟบรรยากาศ รถจอดอยู่ไหน OBD2 และสถานที่จาก iPhone จะโผล่มาหลังเปิด ตั้งค่า → อินเทอร์เฟซ → ฟีเจอร์เบต้า"]],
    all: "ฟีเจอร์ทั้งหมด", tabFeatures: "ฟีเจอร์", tabSettings: "การตั้งค่า",
    setH1: "การตั้งค่าทุกข้อ อธิบายครบ", setLede: "ทุกหน้าในการตั้งค่าของ 7xDash พร้อมสวิตช์ แถบเลื่อน และตัวเลือกทุกตัว ว่าแต่ละอันทำอะไร กดเข้าไปเพื่อดูพร้อมหน้าจอจริง",
    allSettings: "การตั้งค่าทั้งหมด", settingsCount: n => n + " รายการ",
    kinds: { switch: "สวิตช์", slider: "แถบเลื่อน", choice: "ตัวเลือก", text: "ช่องกรอก", button: "กดเพื่อเปิด/สั่งงาน" },
    hiddenNote: "จะเห็นหน้านี้หลังเปิดโหมดนักพัฒนาเท่านั้น", choices: "ตัวเลือก", realSettings: "หน้านี้ใน 7xDash",
    settingsWhere: "การตั้งค่า", open: "เปิดยังไง", steps: "ใช้ยังไง", options: "ปรับอะไรได้บ้าง", notes: "ควรรู้",
    prev: "ก่อนหน้า", next: "ถัดไป", deep: "เจาะลึก", when: "เมื่อ", doit: "ให้ทำ", homeShot: "ตำแหน่งบนหน้าหลัก", realShot: "หน้าจอจริงใน 7xDash",
    foot: "7xDash 1.8.27 · โอเพนซอร์ส GPL-3.0 · ภาพหน้าจอจากตัวจำลองจอรถ · ถ้ามีอะไรไม่ทำงาน ไปที่ ตั้งค่า → ระบบ → การวินิจฉัย แล้วส่งรายงานมาได้เลย"
  }
};

const F = window.FEATURES;
const byId = Object.fromEntries(F.map((f, i) => [f.id, i]));
let lang = "en";
try {
  const s = localStorage.getItem("7xdash-lang");
  if (s === "en" || s === "th") lang = s; else if (/^th/i.test(navigator.language || "")) lang = "th";
} catch (e) { if (/^th/i.test(navigator.language || "")) lang = "th"; }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const img = name => `img/${lang}/${name}.jpg`;
const SIZE = { home: [1600, 935], dash: [792, 636] };
const dims = n => (SIZE[n] || [1280, 748]).join('" height="');
const box = ([l, t, w, h]) => `left:${l}%;top:${t}%;width:${w}%;height:${h}%`;

function overview() {
  const t = T[lang];
  let list = "";
  for (const g of ["cards", "rail", "more"]) {
    list += `<section class="group"><h2>${t.groups[g]}</h2>`;
    for (const f of F.filter(x => x.group === g)) {
      const d = f[lang];
      list += `<a class="item" href="#${f.id}" data-id="${f.id}"><div><div class="name">${esc(d.name)}${f.beta ? `<span class="beta">${t.beta}</span>` : ""}</div>
        <div class="what">${esc(d.what)}</div></div><span class="go" aria-hidden="true">→</span></a>`;
    }
    list += `</section>`;
  }
  const seen = new Set();
  const hits = F.filter(f => !seen.has(f.spot) && seen.add(f.spot))
    .map(f => `<a class="hit" href="#${f.id}" style="${box(SPOT[f.spot])}" aria-label="${esc(f[lang].name)}" data-id="${f.id}"></a>`).join("");
  $("view").innerHTML = `
    <section class="intro"><h1>${t.h1}</h1><div><p>${t.lede}</p><p class="note">${t.note}</p></div></section>
    <div class="split">
      <div class="screen"><div class="shot" id="shot"><img src="${img("home")}" alt="" width="1600" height="935">
        <div class="spot" id="spot" style="${box(SPOT.recorder)}"></div>${hits}</div>
        <div class="caption" id="cap">${t.hint}</div></div>
      <div class="index">${list}</div>
    </div>
    <section class="start">${t.start.map(([h, p]) => `<div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("")}</section>`;
  const show = e => {
    const a = e.target.closest("[data-id]"); if (!a) return;
    const f = F[byId[a.dataset.id]];
    $("spot").setAttribute("style", box(SPOT[f.spot]));
    $("cap").textContent = f[lang].name + " · " + f[lang].what;
  };
  $("view").onmouseover = show;
  $("view").onfocusin = show;
}

function detail(i) {
  const t = T[lang], f = F[i], d = f[lang];
  const prev = F[(i - 1 + F.length) % F.length], next = F[(i + 1) % F.length];
  const pic = f.img === "home"
    ? `<figure class="dshot"><img src="${img("home")}" alt="${esc(d.name)}" width="1600" height="935"><div class="spot" style="${box(SPOT[f.spot])}"></div><figcaption>${t.homeShot}</figcaption></figure>`
    : `<figure class="dshot"><img src="${img(f.img)}" alt="${esc(d.name)}" width="${dims(f.img)}"><figcaption>${t.realShot}</figcaption></figure>`;
  const li = a => a.map(x => `<li>${esc(x)}</li>`).join("");
  const table = r => `<div class="tbl"><table><thead><tr>${r.cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${r.rows.map(row => `<tr>${row.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const exs = a => `<div class="exs">${a.map(e => `${e.g ? `<h3>${esc(e.g)}</h3>` : ""}<div class="ex">
    <div><span class="k">${t.when}</span>${esc(e.when)}</div><div><span class="k">${t.doit}</span><b>${esc(e.do)}</b></div>
    ${e.note ? `<p>${esc(e.note)}</p>` : ""}</div>`).join("")}</div>`;
  const deep = (d.more || []).map(m => `<section class="dsec${m.img ? "" : " noimg"}"><div>
      <h2>${esc(m.h)}</h2>${m.p ? `<p>${esc(m.p)}</p>` : ""}${m.list ? `<ul>${li(m.list)}</ul>` : ""}${m.ol ? `<ol>${li(m.ol)}</ol>` : ""}
      ${m.rows ? table(m.rows) : ""}${m.p2 ? `<p class="p2">${esc(m.p2)}</p>` : ""}${m.ex ? exs(m.ex) : ""}</div>
      ${m.img ? `<figure class="dfig"><img src="${img(m.img)}" alt="${esc(m.cap || m.h)}" width="${dims(m.img)}" loading="lazy"><figcaption>${esc(m.cap || "")}</figcaption></figure>` : ""}
    </section>`).join("");
  $("view").onmouseover = null;
  $("view").onfocusin = null;
  $("view").innerHTML = `
    <a class="crumb" href="#top">← ${t.all}</a>
    <header class="dhead"><div class="where">${t.groups[f.group]}</div>
      <h1>${esc(d.name)}${f.beta ? `<span class="beta">${t.beta}</span>` : ""}</h1><p>${esc(d.intro)}</p></header>
    ${pic}
    <div class="dbody">
      <div>
        <section><h2>${t.open}</h2><p class="open">${esc(d.open)}</p></section>
        <section><h2>${t.steps}</h2><ol>${li(d.steps)}</ol></section>
      </div>
      <div>
        <section><h2>${t.options}</h2><ul>${li(d.options)}</ul></section>
        <section><h2>${t.notes}</h2><ul class="notes">${li(d.notes)}</ul></section>
      </div>
    </div>
    ${deep ? `<div class="deep"><div class="deep-title">${t.deep}</div>${deep}</div>` : ""}
    <nav class="pager" aria-label="${t.prev} / ${t.next}">
      <a href="#${prev.id}"><small>← ${t.prev}</small><b>${esc(prev[lang].name)}</b></a>
      <a href="#${next.id}"><small>${t.next} →</small><b>${esc(next[lang].name)}</b></a>
    </nav>`;
}

const SET = window.SETTINGS;
const setByKey = Object.fromEntries(SET.map((s, i) => [s.key, i]));
const kindOf = type => /Switch/.test(type) ? "switch" : /SeekBar/.test(type) ? "slider"
  : /List|Segmented/.test(type) ? "choice" : /EditText/.test(type) ? "text" : "button";
const L2 = o => o ? (o[lang] || o.en || "") : "";
const intro = key => (SCREEN_INTRO[key] || ["", ""])[lang === "en" ? 0 : 1];
const countOf = s => s.groups.reduce((n, g) => n + g.items.length, 0);

function settingsIndex() {
  const t = T[lang];
  $("view").innerHTML = `
    <section class="intro"><h1>${t.setH1}</h1><div><p>${t.setLede}</p></div></section>
    <div class="screens">${SET.map(s => `<a href="#set-${s.key.replace("screen_", "")}"><div>
      <div class="name">${esc(L2(s.title))}</div><div class="what">${esc(intro(s.key))}${s.hidden ? " " + t.hiddenNote : ""}</div></div>
      <span class="count">${t.settingsCount(countOf(s))} →</span></a>`).join("")}</div>`;
}

function settingsScreen(i) {
  const t = T[lang], s = SET[i];
  const prev = SET[(i - 1 + SET.length) % SET.length], next = SET[(i + 1) % SET.length];
  const pic = s.img ? `<figure class="dshot"><img src="img/${lang}/set-${s.img}.jpg" alt="${esc(L2(s.title))}" width="1280" height="748"><figcaption>${t.realSettings}</figcaption></figure>` : "";
  const groups = s.groups.map(g => `<section class="pref-group">${g.title ? `<h2>${esc(L2(g.title))}</h2>` : ""}
    ${g.items.map(it => {
      const k = kindOf(it.type);
      const choices = it.entries ? `<ul class="choices" aria-label="${t.choices}">${L2(it.entries).map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : "";
      return `<div class="pref"><div><div class="pname">${esc(L2(it.title))}</div><span class="kind ${k}">${t.kinds[k]}</span></div>
        <div><p>${esc(L2(it.summary))}</p>${choices}</div></div>`;
    }).join("")}</section>`).join("");
  $("view").innerHTML = `
    <a class="crumb" href="#settings">← ${t.allSettings}</a>
    <header class="dhead"><div class="where">${t.settingsWhere}</div><h1>${esc(L2(s.title))}</h1><p>${esc(intro(s.key))}</p>
      ${s.hidden ? `<div class="hidden-note">${t.hiddenNote}</div>` : ""}</header>
    ${pic}${groups}
    <nav class="pager" aria-label="${t.prev} / ${t.next}">
      <a href="#set-${prev.key.replace("screen_", "")}"><small>← ${t.prev}</small><b>${esc(L2(prev.title))}</b></a>
      <a href="#set-${next.key.replace("screen_", "")}"><small>${t.next} →</small><b>${esc(L2(next.title))}</b></a>
    </nav>`;
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  $("tag").textContent = t.tag;
  $("foot").textContent = t.foot;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const id = location.hash.slice(1);
  const inSettings = id === "settings" || id.startsWith("set-");
  $("tab-features").textContent = t.tabFeatures;
  $("tab-settings").textContent = t.tabSettings;
  $("tab-features").toggleAttribute("aria-current", !inSettings);
  $("tab-settings").toggleAttribute("aria-current", inSettings);
  if (inSettings) { $("tab-settings").setAttribute("aria-current", "page"); } else { $("tab-features").setAttribute("aria-current", "page"); }
  const setKey = "screen_" + id.slice(4);
  if (id.startsWith("set-") && setKey in setByKey) { settingsScreen(setByKey[setKey]); document.title = L2(SET[setByKey[setKey]].title) + " · 7xDash"; }
  else if (inSettings) { settingsIndex(); document.title = t.tabSettings + " · 7xDash"; }
  else if (id in byId) { detail(byId[id]); document.title = F[byId[id]][lang].name + " · 7xDash"; }
  else { overview(); document.title = "7xDash Features"; }
}

window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
document.querySelector(".lang").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  lang = b.dataset.lang; try { localStorage.setItem("7xdash-lang", lang); } catch (err) {}
  render();
});
render();
</script>
</body>
</html>
