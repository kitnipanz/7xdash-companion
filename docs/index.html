<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Every 7xDash feature and setting for the Zeekr 7X head unit, with real screenshots and how to use them. Thai and English.">
<title>7xDash Features</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Anuphan:wght@400;500;600&display=swap">
<style>
/* Layout: the real Home screen is the map; each feature opens its own page with the real screen it lives on. */
:root {
  --bg: #0d0e10; --surface: #17181b; --line: #2a2c31; --fg: #ececee; --dim: #9fa1a8; --mark: #ff7a1a; --beta: #9db8ea;
  --head: "Bai Jamjuree", "Anuphan", system-ui, sans-serif;
  --text: "Anuphan", system-ui, -apple-system, "Thonburi", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f2f1ee; --surface: #ffffff; --line: #dedcd6; --fg: #18191c; --dim: #5f6168; --mark: #d9580a; --beta: #3a5fa8; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f2f1ee; --surface: #ffffff; --line: #dedcd6; --fg: #18191c; --dim: #5f6168; --mark: #d9580a; --beta: #3a5fa8; color-scheme: light; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 var(--text); }
.page { max-width: 1320px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.word { font: 700 20px var(--head); letter-spacing: .02em; text-decoration: none; }
.word small { font: 500 13px var(--text); color: var(--dim); margin-left: 10px; letter-spacing: 0; }
.lang { display: flex; gap: 2px; font: 500 14px var(--text); }
.lang button { background: none; border: 0; color: var(--dim); padding: 6px 10px; cursor: pointer; border-bottom: 2px solid transparent; font: inherit; }
.lang button[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--mark); }

/* overview */
.intro { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; padding-block: 28px; align-items: end; }
.intro h1 { font: 600 clamp(30px, 4.4vw, 46px)/1.15 var(--head); margin: 0; text-wrap: balance; }
.intro p { margin: 0; color: var(--dim); max-width: 60ch; }
.intro .note { font-size: 14px; margin-top: 10px; }
.split { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.screen { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.shot { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #111; }
.shot img { display: block; width: 100%; height: auto; }
.spot { position: absolute; border: 3px solid var(--mark); border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); pointer-events: none; transition: all .25s ease; }
.hit { position: absolute; background: transparent; border: 0; cursor: pointer; padding: 0; }
.caption { margin-top: 12px; color: var(--dim); font-size: 14px; }
.index { display: grid; gap: 28px; min-width: 0; }
.group h2 { font: 600 14px var(--text); color: var(--dim); margin: 0 0 4px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; text-decoration: none; border-top: 1px solid var(--line); padding: 12px 0; }
.item .name { font: 600 18px/1.3 var(--head); display: flex; gap: 8px; align-items: baseline; }
.item .what { color: var(--dim); margin-top: 2px; }
.item .go { color: var(--dim); font-size: 20px; transition: transform .15s; }
.item:hover .name, .item:focus-visible .name { color: var(--mark); }
.item:hover .go { transform: translateX(3px); color: var(--mark); }
.beta { font: 500 12px var(--text); color: var(--beta); }
.start { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.start h3 { font: 600 17px var(--head); margin: 0 0 4px; }
.start p { margin: 0; color: var(--dim); font-size: 15px; }

/* detail */
.crumb { display: inline-flex; gap: 8px; align-items: center; margin-top: 22px; color: var(--dim); text-decoration: none; font-size: 15px; }
.crumb:hover { color: var(--fg); }
.dhead { padding-block: 12px 24px; display: grid; gap: 8px; max-width: 70ch; }
.dhead .where { font-size: 14px; color: var(--dim); }
.dhead h1 { font: 600 clamp(30px, 4.6vw, 48px)/1.12 var(--head); margin: 0; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.dhead h1 .beta { font-size: 15px; }
.dhead p { margin: 0; font-size: 18px; color: var(--fg); }
.dshot { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #111; position: relative; margin: 0; }
.dshot img { display: block; width: 100%; height: auto; }
.dshot figcaption { position: absolute; left: 12px; bottom: 12px; background: rgba(13,14,16,.82); color: #ececee; font-size: 13px; padding: 4px 10px; border-radius: 6px; }
.dbody { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; padding-top: 28px; }
.dbody h2 { font: 600 20px var(--head); margin: 0 0 8px; }
.dbody section + section { margin-top: 26px; }
.dbody p { margin: 0; }
.dbody ol, .dbody ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.dbody ol li::marker { color: var(--mark); font-weight: 600; font-family: var(--head); }
.dbody ul li::marker { color: var(--dim); }
.open { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.notes li { color: var(--dim); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 40px; border-top: 1px solid var(--line); padding-top: 16px; }
.pager a { text-decoration: none; display: grid; gap: 2px; padding: 8px 0; }
.pager a:last-child { text-align: right; }
.pager small { color: var(--dim); font-size: 13px; }
.pager b { font: 600 18px var(--head); }
.pager a:hover b { color: var(--mark); }
footer { margin-top: 32px; color: var(--dim); font-size: 13px; }

/* sections */
.tabs { display: flex; gap: 4px; margin-right: auto; margin-left: 24px; font: 500 15px var(--text); }
.tabs a { text-decoration: none; color: var(--dim); padding: 6px 12px; border-radius: 8px; }
.tabs a[aria-current="page"] { color: var(--fg); background: var(--surface); }
.tabs a:hover { color: var(--fg); }

/* settings */
.screens { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; }
.screens a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; text-decoration: none; border-top: 1px solid var(--line); padding: 14px 0; }
.screens .name { font: 600 19px/1.3 var(--head); }
.screens .what { color: var(--dim); margin-top: 2px; }
.screens .count { color: var(--dim); font-size: 13px; white-space: nowrap; }
.screens a:hover .name { color: var(--mark); }
.pref-group { margin-top: 30px; }
.pref-group h2 { font: 600 14px var(--text); color: var(--dim); margin: 0 0 6px; }
.pref { display: grid; grid-template-columns: minmax(0, 15em) minmax(0, 1fr); gap: 6px 28px; border-top: 1px solid var(--line); padding: 14px 0; }
.pref .pname { font: 600 17px/1.35 var(--head); }
.pref .kind { display: inline-block; margin-top: 6px; font: 500 12px var(--text); color: var(--dim); border: 1px solid var(--line); border-radius: 999px; padding: 0 9px; }
.pref .kind.switch { color: var(--mark); border-color: color-mix(in srgb, var(--mark) 45%, transparent); }
.pref p { margin: 0; }
.pref .choices { margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.pref .choices li { font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; }
.hidden-note { margin-top: 12px; color: var(--dim); font-size: 14px; }
@media (max-width: 920px) {
  .screens { grid-template-columns: minmax(0, 1fr); }
  .pref { grid-template-columns: minmax(0, 1fr); }
  .tabs { margin-left: 8px; }
  .word small { display: none; }
}

@media (max-width: 920px) {
  .intro, .split, .dbody { grid-template-columns: minmax(0, 1fr); }
  .screen { top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 8px; z-index: 2; }
  .caption { display: none; }
  .start { grid-template-columns: minmax(0, 1fr); }
  .dbody { gap: 0; }
  .dbody > div + div { margin-top: 26px; }
}
@media (prefers-reduced-motion: reduce) { .spot, .item .go { transition: none; } }
</style>
</head>

mber. It is stamped on the video when Plate number stamp is on.", "th": "เลขทะเบียนรถ จะประทับลงในคลิปเมื่อเปิด ประทับป้ายทะเบียน"}}, {"type": "SwitchPreferenceCompat", "key": "pref_watermark", "title": {"en": "Timestamp", "th": "ประทับเวลา"}, "summary": {"en": "Stamps the date and time on the video.", "th": "ประทับวันที่และเวลาลงในคลิป"}}, {"type": "SwitchPreferenceCompat", "key": "pref_watermark_spec", "title": {"en": "Include recording specs", "th": "ใส่สเปกการบันทึก"}, "summary": {"en": "Adds resolution, measured frame rate, codec and live bitrate to the video stamp", "th": "ใส่ความละเอียด อัตราเฟรมที่วัดได้ โคเดก และบิตเรตปัจจุบันลงในตราวิดีโอ"}}, {"type": "SwitchPreferenceCompat", "key": "pref_info_bar", "title": {"en": "Driving info bar", "th": "แถบข้อมูลการขับขี่"}, "summary": {"en": "Adds a strip of vehicle signals below the surround view video. Choose what it shows in Settings → System → System info. Experimental.", "th": "เพิ่มแถบสัญญาณรถใต้วิดีโอรอบคัน เลือกสิ่งที่แสดงได้ที่ การตั้งค่า → ระบบ → ข้อมูลระบบ (ทดลอง)"}}]}], "img": "recording", "hidden": false}, {"key": "screen_storage", "title": {"en": "Storage", "th": "ที่เก็บข้อมูล"}, "summary": null, "groups": [{"title": null, "items": [{"type": "ListPreference", "key": "pref_storage_location", "title": {"en": "Storage location", "th": "ตำแหน่งจัดเก็บ"}, "summary": {"en": "%s", "th": "%s"}}, {"type": "Preference", "key": "pref_storage_sentry_note", "title": {"en": "pref_storage_sentry_note", "th": "pref_storage_sentry_note"}, "summary": {"en": "With Sentry Mode on, only the USB-A port (where Sentry Mode saves its recordings) stays powered after you leave the car, so recording can continue. If the storage location is a drive on the Type-C port, that port loses power and recording switches to the drive on the USB-A port.", "th": "เมื่อเปิดโหมดเฝ้ารถ หลังคุณออกจากรถจะมีไฟเลี้ยงเฉพาะพอร์ต USB-A (ที่โหมดเฝ้ารถบันทึกไฟล์) การบันทึกจึงทำต่อได้ ถ้าตำแหน่งจัดเก็บเป็นไดรฟ์บนพอร์ต Type-C พอร์ตนั้นจะไม่มีไฟและการบันท arview", "title": {"en": "Super mirror", "th": "กระจกมองหลังอัจฉริยะ"}, "summary": {"en": "Shows any surround camera in a floating window; the rear view is mirrored left to right, like the interior mirror", "th": "แสดงกล้องรอบคันตัวใดก็ได้ในหน้าต่างลอย ภาพด้านหลังกลับซ้ายขวาเหมือนกระจกมองหลังในรถ"}}, {"type": "SwitchPreferenceCompat", "key": "pref_rearview_front_rear", "title": {"en": "Front and rear only", "th": "หน้าและหลังเท่านั้น"}, "summary": {"en": "Switches between the front and rear views only", "th": "สลับระหว่างมุมหน้าและมุมหลังเท่านั้น"}}, {"type": "SwitchPreferenceCompat", "key": "pref_rearview_fisheye", "title": {"en": "Fisheye correction", "th": "แก้ภาพตาปลา"}, "summary": {"en": "Corrects fisheye barrel distortion in the Super mirror only; recordings are unchanged.", "th": "แก้ความโค้งของเลนส์ตาปลาเฉพาะในกระจกมองหลังอัจฉริยะ ไฟล์บันทึกไม่เปลี่ยน"}}, {"type": "SeekBarPreference", "key": "pref_rearview_fov", "title": {"en": "Field of view", "th": "มุมมองภาพ"}, "summary": {"en": "Wider shows more and looks sharper, with more distortion at the edges", "th": "กว้างขึ้นเห็นได้มากขึ้นและดูคมขึ้น แต่ขอบภาพบิดเบี้ยวมากขึ้น"}}, {"type": "SeekBarPreference", "key": "pref_rearview_width", "title": {"en": "Window width", "th": "ความกว้างหน้าต่าง"}, "summary": {"en": "Width of the Super mirror window.", "th": "ความกว้างของหน้าต่างกระจกมองหลัง"}}, {"type": "SeekBarPreference", "key": "pref_rearview_height", "title": {"en": "Window height", "th": "ความสูงหน้าต่าง"}, "summary": {"en": "Each can go up to full screen; the picture keeps its proportions and the window shape only sets how much is visible", "th": "แต่ละค่าขยายได้ถึงเต็มจอ ภาพคงสัดส่วนเดิม รูปทรงหน้าต่างกำหนดแค่ว่าเห็นได้มากแค่ไหน"}}, {"type": "SwitchPreferenceCompat", "key": "pref_rearview_button_mode", "title": {"en": "Button mode", "th": "โหมดปุ่ม"}, "summary": {"en": "Switches to the front, rear, left or right view when the top, bottom, left or right area is tapped", "th": "สลับไปมุมหน้า หลัง ซ้าย หรือขวา ning a door shows the camera on that side, so you can see cars and bikes coming from behind. It closes when the doors close", "th": "ขณะรถจอด เมื่อเปิดประตูจะแสดงกล้องฝั่งนั้น เพื่อดูรถหรือจักรยานที่มาจากด้านหลัง และปิดเมื่อประตูปิดหมด"}}, {"type": "SwitchPreferenceCompat", "key": "pref_side_popup_over_factory", "title": {"en": "Show over the car's own view", "th": "แสดงทับภาพของรถ"}, "summary": {"en": "Opens even while the car shows its 360 view, its own side view or park assist. Never in R", "th": "ขึ้นได้แม้รถกำลังแสดงภาพ 360 ภาพด้านข้างของรถเอง หรือระบบช่วยจอด ยกเว้นตอนเข้าเกียร์ R"}}, {"type": "SwitchPreferenceCompat", "key": "pref_side_popup_instant", "title": {"en": "Instant pop-up", "th": "ป๊อปอัปทันใจ"}, "summary": {"en": "In D, keeps the side view ready in the background so the picture is there as soon as you signal. The camera stays on while driving, which uses a little more power", "th": "ในเกียร์ D จะเตรียมภาพด้านข้างไว้เบื้องหลัง ภาพจึงขึ้นทันทีที่เปิดไฟเลี้ยว กล้องเปิดค้างขณะขับ ใช้พลังงานมากขึ้นเล็กน้อย"}}, {"type": "SeekBarPreference", "key": "pref_side_popup_close_delay_ms", "title": {"en": "Stay open after the signal (ms)", "th": "เปิดค้างหลังไฟเลี้ยวดับ (มิลลิวินาที)"}, "summary": {"en": "1000 ms = 1 second. 0 closes it as soon as the signal goes off. Reversing still closes it straight away, and so does the car's own view when Show over the car's own view is off", "th": "1000 มิลลิวินาที = 1 วินาที 0 คือปิดทันทีที่ไฟเลี้ยวดับ เข้าเกียร์ถอยยังปิดป๊อปอัปทันที และภาพของรถก็ปิดทันทีถ้าปิด \"แสดงทับภาพของรถ\" ไว้"}}]}, {"title": {"en": "Picture", "th": "ภาพ"}, "items": [{"type": "SwitchPreferenceCompat", "key": "pref_side_popup_straighten", "title": {"en": "Straighten picture", "th": "ปรับภาพให้ตรง"}, "summary": {"en": "Corrects the fisheye curve before showing it; the three settings below set how wide it looks and where it points. Only changes the pop-up; recordings are not affected", "th": "แก้ความโค้งของเลนส์ตาปลาก่อนแสดง สามค่าด้านล่างกำหนดความกว้ t", "th": "จุดบอด"}, "items": [{"type": "Preference", "key": "pref_side_popup_bsd_finder", "title": {"en": "Blind-spot warning finder", "th": "ค้นหาสัญญาณเตือนจุดบอด"}, "summary": {"en": "Teach 7xDash which car signal means a car is in your blind spot. Then the side view gets a red edge and the mood lights blink orange while it warns", "th": "สอน 7xDash ว่าสัญญาณไหนของรถบอกว่ามีรถอยู่ในจุดบอด จากนั้นภาพด้านข้างจะมีขอบแดง และไฟบรรยากาศจะกะพริบสีส้มขณะเตือน"}}, {"type": "SwitchPreferenceCompat", "key": "pref_side_popup_bsd_sniffer", "title": {"en": "Report blind-spot signals (experimental)", "th": "แจ้งสัญญาณจุดบอด (ทดลอง)"}, "summary": {"en": "While the screen is on, watches every car setting that looks blind-spot related. Each change is written to the log and black box and shown on the HUD as \"BSD?\" with its name and value, so you notice when the car sends something as a car passes. Then teach it in the Blind-spot warning finder", "th": "ขณะหน้าจอเปิด จะเฝ้าดูการตั้งค่ารถทุกอย่างที่ดูเกี่ยวกับจุดบอด ทุกครั้งที่ค่าเปลี่ยนจะบันทึกลงล็อกและกล่องดำ และแสดงบน HUD เป็น \"BSD?\" พร้อมชื่อและค่า ให้รู้ว่ารถส่งสัญญาณอะไรตอนมีรถผ่าน จากนั้นสอนได้ในหน้าค้นหาสัญญาณเตือนจุดบอด"}}]}], "img": "side_mirror", "hidden": false}, {"key": "screen_floating", "title": {"en": "Floating button", "th": "ปุ่มลอย"}, "summary": null, "groups": [{"title": null, "items": [{"type": "SwitchPreferenceCompat", "key": "pref_recording_floating", "title": {"en": "Floating button", "th": "ปุ่มลอย"}, "summary": {"en": "Shows recording status in a floating button; set tap and long-press actions below", "th": "แสดงสถานะการบันทึกในปุ่มลอย ตั้งค่าการแตะและการกดค้างได้ด้านล่าง"}}, {"type": "SwitchPreferenceCompat", "key": "pref_dash_panel", "title": {"en": "Dash panel", "th": "แผงหน้าปัด"}, "summary": {"en": "A small card that floats over maps, music or any other app: speed, gear, turn signals, the clock and whether 7xDash is recording, with buttons for a surround photo, an instant capture, Super mirror and e": "SwitchPreferenceCompat", "key": "pref_vehicle_status", "title": {"en": "Vehicle status (experimental)", "th": "สถานะรถ (ทดลอง)"}, "summary": {"en": "Shows horn, flash-to-pass and hazard lights below Straighten on the main screen, using the Driving info bar icons; the horn signal can't be read yet", "th": "แสดงแตร การกะพริบไฟสูง และไฟฉุกเฉินใต้ ปรับให้ตรง บนหน้าจอหลัก โดยใช้ไอคอนแถบข้อมูลการขับขี่ ยังอ่านสัญญาณแตรไม่ได้"}}, {"type": "ListPreference", "key": "pref_fisheye_projection", "title": {"en": "Fisheye projection", "th": "การฉายภาพตาปลา"}, "summary": {"en": "How fisheye pictures are flattened when fisheye correction is on.", "th": "วิธีแก้ภาพโค้งจากเลนส์ตาปลา ตอนเปิดแก้ภาพตาปลา"}}, {"type": "SeekBarPreference", "key": "pref_fisheye_fov", "title": {"en": "Corrected field of view", "th": "มุมมองหลังแก้ภาพ"}, "summary": {"en": "A wider angle keeps more of the picture. Up to 140° for Straight lines, 180° for Wide and Full circle.", "th": "มุมกว้างขึ้นเก็บภาพได้มากขึ้น สูงสุด 140° สำหรับเส้นตรง 180° สำหรับกว้างและวงกลมเต็ม"}}]}], "img": "interface", "hidden": false}, {"key": "screen_system", "title": {"en": "System", "th": "ระบบ"}, "summary": null, "groups": [{"title": null, "items": [{"type": "SwitchPreferenceCompat", "key": "pref_auto_start", "title": {"en": "Start on boot", "th": "เริ่มเมื่อเปิดเครื่อง"}, "summary": {"en": "Keeps the app running in the background. After the head unit restarts or the system closes the app, restarts it and restores Super mirror, the floating button and auto-recording if they were on. When off, it isn't restarted.", "th": "ให้แอปทำงานอยู่เบื้องหลัง หลังหัวเครื่องรีสตาร์ทหรือระบบปิดแอป จะเปิดแอปใหม่และคืนค่ากระจกมองหลังอัจฉริยะ ปุ่มลอย และการบันทึกอัตโนมัติถ้าเคยเปิดไว้ เมื่อปิด จะไม่เปิดแอปใหม่"}, "default": "true"}, {"type": "SwitchPreferenceCompat", "key": "pref_screen_off_keep_recording", "title": {"en": "Keep recording when the screen goes off", "th": "บันทึกต่อเมื่อจอดับ"}, "summary": {"en": "Records only the surround view with the screen off; front and rear cabin recording resumes when the screen turns on. Without Sentry Mode, recording pauses while the head unit sleeps and resumes on wake. When off, recording stops once the screen turns off.", "th": "ขณะจอดับจะบันทึกเฉพาะภาพรอบคัน กล้องห้องโดยสารหน้าและหลังจะบันทึกต่อเมื่อจอเปิด ถ้าไม่มีโหมดเฝ้ารถ การบันทึกจะหยุดชั่วคราวขณะหัวเครื่องหลับและทำต่อเมื่อตื่น เมื่อปิด การบันทึกจะหยุดเมื่อจอดับ"}, "default": "true"}, {"type": "Preference", "key": "pref_usb_backup", "title": {"en": "Back up settings to USB", "th": "สำรองการตั้งค่าลง USB"}, "summary": {"en": "Settings, shortcuts, stickers, lights, speakers and announcements are copied to the USB stick a few seconds after any change, and come back by themselves after a reinstall. Tap to copy now.", "th": "การตั้งค่า ปุ่มลัด สติกเกอร์ ไฟ ลำโพง และประกาศ จะถูกคัดลอกลง USB ไม่กี่วินาทีหลังเปลี่ยน และกลับมาเองหลังติดตั้งใหม่ แตะเพื่อคัดลอกตอนนี้"}}, {"type": "Preference", "key": "pref_usb_restore", "title": {"en": "Restore settings from USB", "th": "กู้คืนการตั้งค่าจาก USB"}, "summary": {"en": "Put back the copy on the USB stick and restart 7xDash", "th": "นำสำเนาใน USB กลับมาใช้ แล้วเริ่ม 7xDash ใหม่"}}, {"type": "Preference", "key": "pref_diagnostics", "title": {"en": "Diagnostics", "th": "การวินิจฉัย"}, "summary": {"en": "View and export camera, display and storage details and recent logs", "th": "ดูและส่งออกรายละเอียดกล้อง หน้าจอ ที่เก็บข้อมูล และบันทึกล่าสุด"}}, {"type": "Preference", "key": "pref_vehicle_info", "title": {"en": "System info (experimental)", "th": "ข้อมูลระบบ (ทดลอง)"}, "summary": {"en": "Vehicle signals the head unit exposes and their current state; ticked items appear on the Driving info bar", "th": "สัญญาณรถที่หัวเครื่องเปิดให้อ่านและสถานะปัจจุบัน รายการที่ติ๊กจะแสดงบนแถบข้อมูลการขับขี่"}}, {"type": "Preference", "key": "pref_screen_probe", "title": {"en": "Screen (experimental)", "th": "หน้าจอ (ทดลอง)"}, "summary": {"en": "Lists every screen this app can open. Tap one and that screen shows text", "th": "แสดงทุกหน้าจอที่แอปนี้เปิดได้ แตะหนึ่งรายการแล้วหน้าจอนั้นจะแสดงข้อความ"}}, {"type": "SwitchPreferenceCompat", "key": "pref_save_moment_usb", "title": {"en": "Save moment to USB", "th": "บันทึกช่วงเวลาลง USB"}, "summary": {"en": "On by default. Copies finished clips into the moments folder on the USB stick", "th": "เปิดเป็นค่าเริ่มต้น คัดลอกคลิปที่เสร็จแล้วไปยังโฟลเดอร์ช่วงเวลาบน USB"}}, {"type": "SwitchPreferenceCompat", "key": "pref_save_moment_drive", "title": {"en": "Upload moment to Google Drive", "th": "อัปโหลดช่วงเวลาไปยัง Google Drive"}, "summary": {"en": "Also upload those clips when Drive is signed in. Off until you turn it on", "th": "อัปโหลดคลิปเหล่านั้นด้วยเมื่อลงชื่อเข้า Drive แล้ว ปิดไว้จนกว่าคุณจะเปิด"}}]}, {"title": {"en": "Cabin passenger", "th": "ภาพห้องโดยสาร"}, "items": [{"type": "SeekBarPreference", "key": "pref_cabin_width", "title": {"en": "Window width", "th": "ความกว้างหน้าต่าง"}, "summary": {"en": "Width of the Cabin passenger window.", "th": "ความกว้างของหน้าต่างภาพห้องโดยสาร"}}, {"type": "SeekBarPreference", "key": "pref_cabin_height", "title": {"en": "Window height", "th": "ความสูงหน้าต่าง"}, "summary": {"en": "The picture keeps its shape. A wider or taller window shows more of the front cabin.", "th": "ภาพคงรูปทรงเดิม หน้าต่างที่กว้างหรือสูงขึ้นจะเห็นห้องโดยสารหน้าได้มากขึ้น"}}]}], "img": "system", "hidden": false}, {"key": "screen_developer", "title": {"en": "Developer options", "th": "ตัวเลือกนักพัฒนา"}, "summary": null, "groups": [{"title": null, "items": [{"type": "SwitchPreferenceCompat", "key": "pref_force_h264", "title": {"en": "Force H.264", "th": "บังคับ H.264"}, "summary": {"en": "Uses H.264 for every camera, overriding the codec set for each camera in Edit stream profile", "th": "ใช้ H.264 กับทุกกล้อง แทนโคเดกที่ตั้งไว้ของแต่ละกล้องในแก้ไขโปรไฟล์สตรีม"}}, {"type": "SwitchPreferenceCompat", "key": "pref_screen_off_recording", "title": {"en": "Screen-off recording (keep awake)", "th": "บันทึกขณะจอดับ (กันเครื่องหลับ)"}, "summary": {"en": "If recording when the screen turns off, keep recording the surround view and keep the head unit awake for up to the time set below", "th": "ถ้ากำลังบันทึกตอนจอดับ จะบันทึกภาพรอบคันต่อและกันหัวเครื่องไม่ให้หลับได้นานสุดตามเวลาที่ตั้งด้านล่าง"}}, {"type": "EditTextPreference", "key": "pref_screen_off_wake_hours", "title": {"en": "Keep awake for up to (hours)", "th": "กันเครื่องหลับได้นานสุด (ชั่วโมง)"}, "summary": {"en": "The longest 7xDash keeps the head unit awake after the screen goes off.", "th": "นานสุดที่ 7xDash จะกันไม่ให้จอรถหลับหลังจอดับ"}}, {"type": "Preference", "key": "pref_image_adjust", "title": {"en": "Image adjustment", "th": "ปรับภาพ"}, "summary": {"en": "Opens a window to adjust exposure, white balance, noise reduction and more, live", "th": "เปิดหน้าต่างปรับค่าแสง สมดุลแสงขาว การลดสัญญาณรบกวน และอื่นๆ แบบสด"}}, {"type": "Preference", "key": "pref_image_adjust_reset", "title": {"en": "Reset image adjustment", "th": "รีเซ็ตการปรับภาพ"}, "summary": {"en": "Puts brightness, contrast and colour back to default.", "th": "คืนค่าความสว่าง คอนทราสต์ และสี กลับเป็นค่าเริ่มต้น"}}, {"type": "Preference", "key": "pref_camera_mapping", "title": {"en": "Camera mapping", "th": "การจับคู่กล้อง"}, "summary": {"en": "Choose which camera feeds the surround, front cabin and rear cabin views (troubleshooting)", "th": "เลือกกล้องที่ป้อนภาพรอบคัน ห้องโดยสารหน้า และห้องโดยสารหลัง (สำหรับแก้ปัญหา)"}}, {"type": "Preference", "key": "pref_permissions", "title": {"en": "Permissions", "th": "สิทธิ์"}, "summary": {"en": "Manage the permissions the app needs", "th": "จัดการสิทธิ์ที่แอปต้องใช้"}}, {"type": "Preference", "key": "pref_speaker_probe", "title": {"en": "Speaker probe", "th": "ตรวจลำโพง"}, "summary": {"en": "Lists every output this process can address. Tap a row to play a short tone. This page does not label cabin or outside.", "th": "แสดงทุกเอาต์พุตที่โปรเซสนี้ส่งเสียงได้ แตะแถวเพื่อเล่นเสียงสั้นๆ หน้านี้ไม่ได้ระบุว่าเป็นใ const F = window.FEATURES;
const byId = Object.fromEntries(F.map((f, i) => [f.id, i]));
let lang = "en";
try {
  const s = localStorage.getItem("7xdash-lang");
  if (s === "en" || s === "th") lang = s; else if (/^th/i.test(navigator.language || "")) lang = "th";
} catch (e) { if (/^th/i.test(navigator.language || "")) lang = "th"; }

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const img = name => `img/${lang}/${name}.jpg`;
const box = ([l, t, w, h]) => `left:${l}%;top:${t}%;width:${w}%;height:${h}%`;

function overview() {
  const t = T[lang];
  let list = "";
  for (const g of ["cards", "rail", "more"]) {
    list += `<section class="group"><h2>${t.groups[g]}</h2>`;
    for (const f of F.filter(x => x.group === g)) {
      const d = f[lang];
      list += `<a class="item" href="#${f.id}" data-id="${f.id}"><div><div class="name">${esc(d.name)}${f.beta ? `<span class="beta">${t.beta}</span>` : ""}</div>
        <div class="what">${esc(d.what)}</div></div><span class="go" aria-hidden="true">→</span></a>`;
    }
    list += `</section>`;
  }
  const seen = new Set();
  const hits = F.filter(f => !seen.has(f.spot) && seen.add(f.spot))
    .map(f => `<a class="hit" href="#${f.id}" style="${box(SPOT[f.spot])}" aria-label="${esc(f[lang].name)}" data-id="${f.id}"></a>`).join("");
  $("view").innerHTML = `
    <section class="intro"><h1>${t.h1}</h1><div><p>${t.lede}</p><p class="note">${t.note}</p></div></section>
    <div class="split">
      <div class="screen"><div class="shot" id="shot"><img src="${img("home")}" alt="" width="1600" height="925">
        <div class="spot" id="spot" style="${box(SPOT.recorder)}"></div>${hits}</div>
        <div class="caption" id="cap">${t.hint}</div></div>
      <div class="index">${list}</div>
    </div>
    <section class="start">${t.start.map(([h, p]) => `<div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("")}</section>`;
  const show = e => {
    const a = e.target.closest("[data-id]"); if (!a) return;
    const f = F[byId[a.dataset.id]];
    $("spot").setAttribute("style", box(SPOT[f.spot]));
    $("cap").textContent = f[lang].name + " · " + f[lang].what;
  };
  $("view").onmouseover = show;
  $("view").onfocusin = show;
}

function detail(i) {
  const t = T[lang], f = F[i], d = f[lang];
  const prev = F[(i - 1 + F.length) % F.length], next = F[(i + 1) % F.length];
  const pic = f.img === "home"
    ? `<figure class="dshot"><img src="${img("home")}" alt="${esc(d.name)}" width="1600" height="925"><div class="spot" style="${box(SPOT[f.spot])}"></div><figcaption>${t.homeShot}</figcaption></figure>`
    : `<figure class="dshot"><img src="${img(f.img)}" alt="${esc(d.name)}" width="1280" height="740"><figcaption>${t.realShot}</figcaption></figure>`;
  const li = a => a.map(x => `<li>${esc(x)}</li>`).join("");
  $("view").onmouseover = null;
  $("view").onfocusin = null;
  $("view").innerHTML = `
    <a class="crumb" href="#top">← ${t.all}</a>
    <header class="dhead"><div class="where">${t.groups[f.group]}</div>
      <h1>${esc(d.name)}${f.beta ? `<span class="beta">${t.beta}</span>` : ""}</h1><p>${esc(d.intro)}</p></header>
    ${pic}
    <div class="dbody">
      <div>
        <section><h2>${t.open}</h2><p class="open">${esc(d.open)}</p></section>
        <section><h2>${t.steps}</h2><ol>${li(d.steps)}</ol></section>
      </div>
      <div>
        <section><h2>${t.options}</h2><ul>${li(d.options)}</ul></section>
        <section><h2>${t.notes}</h2><ul class="notes">${li(d.notes)}</ul></section>
      </div>
    </div>
    <nav class="pager" aria-label="${t.prev} / ${t.next}">
      <a href="#${prev.id}"><small>← ${t.prev}</small><b>${esc(prev[lang].name)}</b></a>
      <a href="#${next.id}"><small>${t.next} →</small><b>${esc(next[lang].name)}</b></a>
    </nav>`;
}

const SET = window.SETTINGS;
const setByKey = Object.fromEntries(SET.map((s, i) => [s.key, i]));
const kindOf = type => /Switch/.test(type) ? "switch" : /SeekBar/.test(type) ? "slider"
  : /List|Segmented/.test(type) ? "choice" : /EditText/.test(type) ? "text" : "button";
const L2 = o => o ? (o[lang] || o.en || "") : "";
const intro = key => (SCREEN_INTRO[key] || ["", ""])[lang === "en" ? 0 : 1];
const countOf = s => s.groups.reduce((n, g) => n + g.items.length, 0);

function settingsIndex() {
  const t = T[lang];
  $("view").innerHTML = `
    <section class="intro"><h1>${t.setH1}</h1><div><p>${t.setLede}</p></div></section>
    <div class="screens">${SET.map(s => `<a href="#set-${s.key.replace("screen_", "")}"><div>
      <div class="name">${esc(L2(s.title))}</div><div class="what">${esc(intro(s.key))}${s.hidden ? " " + t.hiddenNote : ""}</div></div>
      <span class="count">${t.settingsCount(countOf(s))} →</span></a>`).join("")}</div>`;
}

function settingsScreen(i) {
  const t = T[lang], s = SET[i];
  const prev = SET[(i - 1 + SET.length) % SET.length], next = SET[(i + 1) % SET.length];
  const pic = s.img ? `<figure class="dshot"><img src="img/${lang}/set-${s.img}.jpg" alt="${esc(L2(s.title))}" width="1280" height="740"><figcaption>${t.realSettings}</figcaption></figure>` : "";
  const groups = s.groups.map(g => `<section class="pref-group">${g.title ? `<h2>${esc(L2(g.title))}</h2>` : ""}
    ${g.items.map(it => {
      const k = kindOf(it.type);
      const choices = it.entries ? `<ul class="choices" aria-label="${t.choices}">${L2(it.entries).map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : "";
      return `<div class="pref"><div><div class="pname">${esc(L2(it.title))}</div><span class="kind ${k}">${t.kinds[k]}</span></div>
        <div><p>${esc(L2(it.summary))}</p>${choices}</div></div>`;
    }).join("")}</section>`).join("");
  $("view").innerHTML = `
    <a class="crumb" href="#settings">← ${t.allSettings}</a>
    <header class="dhead"><div class="where">${t.settingsWhere}</div><h1>${esc(L2(s.title))}</h1><p>${esc(intro(s.key))}</p>
      ${s.hidden ? `<div class="hidden-note">${t.hiddenNote}</div>` : ""}</header>
    ${pic}${groups}
    <nav class="pager" aria-label="${t.prev} / ${t.next}">
      <a href="#set-${prev.key.replace("screen_", "")}"><small>← ${t.prev}</small><b>${esc(L2(prev.title))}</b></a>
      <a href="#set-${next.key.replace("screen_", "")}"><small>${t.next} →</small><b>${esc(L2(next.title))}</b></a>
    </nav>`;
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  $("tag").textContent = t.tag;
  $("foot").textContent = t.foot;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const id = location.hash.slice(1);
  const inSettings = id === "settings" || id.startsWith("set-");
  $("tab-features").textContent = t.tabFeatures;
  $("tab-settings").textContent = t.tabSettings;
  $("tab-features").toggleAttribute("aria-current", !inSettings);
  $("tab-settings").toggleAttribute("aria-current", inSettings);
  if (inSettings) { $("tab-settings").setAttribute("aria-current", "page"); } else { $("tab-features").setAttribute("aria-current", "page"); }
  const setKey = "screen_" + id.slice(4);
  if (id.startsWith("set-") && setKey in setByKey) { settingsScreen(setByKey[setKey]); document.title = L2(SET[setByKey[setKey]].title) + " · 7xDash"; }
  else if (inSettings) { settingsIndex(); document.title = t.tabSettings + " · 7xDash"; }
  else if (id in byId) { detail(byId[id]); document.title = F[byId[id]][lang].name + " · 7xDash"; }
  else { overview(); document.title = "7xDash Features"; }
}

window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
document.querySelector(".lang").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  lang = b.dataset.lang; try { localStorage.setItem("7xdash-lang", lang); } catch (err) {}
  render();
});
render();
</script>
</body>
</html>
